[package]
name = "powdb-compare"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Optional comparison clients are excluded from production packages.
default = []
mysql = ["dep:mysql"]
competitive = []
competitive-powdb = ["competitive"]
competitive-sqlite = ["competitive"]
competitive-duckdb = ["competitive", "dep:duckdb"]
competitive-postgres = ["competitive"]
competitive-mysql = ["competitive", "mysql"]
competitive-wire = ["competitive", "dep:powdb-server"]

[dependencies]
powdb-storage = { path = "../storage" }
powdb-query = { path = "../query" }
rusqlite = { version = "0.32", features = ["bundled"] }
postgres = "0.19"
tempfile = "3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
blake3.workspace = true
duckdb = { version = "=1.20000.1", optional = true, default-features = false }
powdb-server = { path = "../server", optional = true }
# Optional — only compiled in when the `mysql` feature is enabled.
mysql = { version = "=28.0.4", default-features = false, features = ["default-rust", "rustls-tls"], optional = true }

[[bin]]
name = "compare-engines"
path = "src/main.rs"
test = true

[[bin]]
name = "powdb-compare-paired"
path = "src/paired.rs"
test = true

[[bin]]
name = "powdb-competitive-worker"
path = "src/competitive_worker.rs"
required-features = ["competitive"]

[lints]
workspace = true
