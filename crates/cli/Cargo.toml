[package]
name = "powdb-cli"
description = "Interactive REPL and CLI for PowDB, an embedded database with a pipeline query language and nested results"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# The crate's OWN reference doc, not the root project README. Both are shipped
# in the tarball (cargo copies the package-root README.md in either case), but
# the manifest key is what crates.io renders on the package page, and the CLI
# reference is the right page for `cargo install powdb-cli`. Pointing this at
# `../../README.md` also produced a cargo warning on every `cargo package`,
# because a README.md already exists in the package root.
readme = "README.md"
keywords = ["database", "powdb", "powql", "cli", "embedded-database"]
categories = ["database", "command-line-utilities"]
documentation = "https://docs.rs/powdb-cli"

[dependencies]
powdb-storage = { version = "0.23.0", path = "../storage" }
powdb-query = { version = "0.23.0", path = "../query" }
powdb-server = { version = "0.23.0", path = "../server" }
powdb-backup = { version = "0.23.0", path = "../backup" }
powdb-auth = { version = "0.23.0", path = "../auth" }
powdb-sync = { version = "0.23.0", path = "../sync" }
rustyline = "15"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
# Built-in trust anchors (Mozilla CA program) for `--tls` without `--tls-ca`.
# Chosen over rustls-native-certs so verification behaves identically on every
# platform the CLI ships to, staying on the same rustls stack as the server.
webpki-roots = "1"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Self-signed certificate generation for the TLS process test, matching the
# server crate's dev-dependency (crates/server/tests/tls_connection.rs).
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }

[lints]
workspace = true
