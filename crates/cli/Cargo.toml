[package]
name = "powdb-cli"
description = "Interactive REPL and CLI for PowDB — 3-10x faster than SQLite on aggregates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["database", "powdb", "powql", "cli", "embedded-database"]
categories = ["database", "command-line-utilities"]
documentation = "https://docs.rs/powdb-cli"

[dependencies]
powdb-storage = { version = "0.9.0", path = "../storage" }
powdb-query = { version = "0.9.0", path = "../query" }
powdb-server = { version = "0.9.0", path = "../server" }
powdb-backup = { version = "0.9.0", path = "../backup" }
powdb-auth = { version = "0.9.0", path = "../auth" }
powdb-sync = { version = "0.9.0", path = "../sync" }
rustyline = "15"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
