[package]
name = "powdb-server"
description = "Async TCP server for PowDB with a binary wire protocol — PowQL native, SQL frontend included"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["database", "powdb", "powql", "server", "tcp"]
categories = ["database", "database-implementations", "network-programming"]
documentation = "https://docs.rs/powdb-server"

[dependencies]
powdb-storage = { version = "0.23.0", path = "../storage" }
powdb-query = { version = "0.23.0", path = "../query" }
powdb-auth = { version = "0.23.0", path = "../auth" }
powdb-sync = { version = "0.23.0", path = "../sync" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
sha2 = "0.11"
zeroize = "1"
thiserror.workspace = true
bytes.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3"

[lints]
workspace = true
