[package]
name = "powdb-server"
description = "Async TCP server for PowDB with binary wire protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
powdb-storage = { version = "0.2.1", path = "../storage" }
powdb-query = { version = "0.2.1", path = "../query" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
sha2 = "0.10"
thiserror.workspace = true
bytes.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
