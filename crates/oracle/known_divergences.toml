# Accepted differences between PowDB and SQLite (or between PowDB's own two
# frontends). This file is NOT a suppression list and the harness works hard to
# keep it from becoming one:
#
#   * every entry must carry a `reason` and an `owner` of the form
#     `path/to/file:LINE`; the file must exist and the line must be inside it;
#   * every entry must match at least one divergence in the run, so an entry
#     that stops applying fails CI instead of quietly living on;
#   * every entry must name a `shape` that a generator really produces;
#   * at most one entry may claim a given (shape, pair, fixture), so two
#     accepted reasons for one shape force the SHAPE to be split rather than
#     the ledger to be widened;
#   * an unknown key, a missing key or a duplicate id fails to parse.
#
# Keys:
#   id      unique slug
#   shape   the query shape from `src/shapes.rs`
#   pair    powql_vs_sqlite | powql_vs_powdb_sql
#   fixture optional; restricts the entry to one fixture
#   reason  why this difference is correct (or accepted) rather than a bug
#   owner   the file:line that decides the behaviour
#   anchor  optional; text that must appear ON the owner line. A line number
#           alone rots silently, because it stays *valid* while the code around
#           it moves: two entries here once pointed at the LIKE matcher and
#           ended up pointing at unrelated BinOp arms with every check green.
#           An anchor makes that drift a hard failure and reports the line the
#           text moved to, so re-pointing is a one-line fix.
#
# The PowQL-vs-PowDB-SQL pair is held to a much higher bar than the SQLite
# pairs. The two frontends lower to the same plan tree, so a difference between
# them is an engine bug with no defensible reason -- unless the *same source
# text* legitimately means different things in the two languages. There is
# exactly one such case, `x = NULL`, recorded below, and it exists because
# fixing it in the other direction would have been worse: SQL text that
# silently returns the `IS NULL` rows is a silent wrong answer for every user
# porting a query in. Any second entry for this pair should be treated as an
# engine bug until proven otherwise.

[[divergence]]
id = "order-by-asc-is-nulls-last"
shape = "order_asc_naive"
pair = "powql_vs_sqlite"
reason = "PowDB has an engine-wide NULLS LAST ordering contract in both directions; SQLite is NULLS FIRST ascending and NULLS LAST descending. Only the placement of the null block differs. The ordering of the non-null values is still policed in full by the order_asc_nulls_last shape, which spells PowDB's rule in SQLite's own language (col IS NULL as a leading key) and carries no entry, and by order_desc, where the two engines already agree natively."
owner = "crates/query/src/executor/plan_exec/mod.rs:55"

[[divergence]]
id = "not-of-a-comparison-is-two-valued"
shape = "filter_not"
pair = "powql_vs_sqlite"
reason = "PowDB filter logic is deliberately two-valued: a comparison against a missing value is false, so NOT makes it true and the row is kept, where standard three-valued SQL keeps it unknown and drops the row. This is documented user-facing behaviour in docs/SQL.md and docs/POWQL.md, not an accident. Every non-negated comparison shape (filter_cmp, filter_and, filter_or) agrees with SQLite exactly, which is what shows the divergence is confined to NOT."
owner = "docs/SQL.md:66"

[[divergence]]
id = "like-is-case-sensitive"
shape = "like_ascii_case"
pair = "powql_vs_sqlite"
reason = "SQLite's default LIKE folds ASCII case (a LIKE A is true); PowDB's LIKE compares characters as they are, which is what PostgreSQL LIKE does. Only ASCII case folding differs: the like_wildcard_only shape uses patterns with no ASCII letter and carries no entry, and it confirms that % and _ arity, UTF-8 character counting for _, and literal matching of multi-byte text all agree exactly."
owner = "crates/query/src/executor/eval.rs:1306"
anchor = "p[pi] == '_' || p[pi] == t[ti]"

[[divergence]]
id = "like-pattern-percent-consumed-as-a-literal"
shape = "like_metachar_in_text"
pair = "powql_vs_sqlite"
reason = "CONFIRMED ENGINE BUG, recorded here so the gate stays actionable and so fixing it forces this entry to be deleted (a fix makes the entry match nothing and CI fails on the stale entry). like_match tests the literal/underscore branch before the % branch, so a pattern % that lands on a literal % in the text is consumed as an ordinary character and no backtrack point is recorded. Repro: `T filter .s like \"%\"` does NOT match a row whose s is \"%a\" or \"%%\", even though LIKE '%' must match every non-null string. Also `like_match(\"%\", \"%_\")` is false where SQL says true. Fix is to test p[pi] == '%' first. Confined to this shape and to the sm column: like_ascii_case and like_wildcard_only run over metacharacter-free text and carry no entry for this."
owner = "crates/query/src/executor/eval.rs:1309"
anchor = "p[pi] == '%'"

[[divergence]]
id = "sum-of-no-numeric-rows-is-zero-not-null"
shape = "agg_sum_avg_int"
pair = "powql_vs_sqlite"
reason = "PowDB's sum over an empty or all-null input returns Int(0); SQL returns NULL. This is a real semantic difference and it is recorded here rather than fixed because changing it is a wire-visible behaviour change that this lane does not own. It is worth noting that avg in the very same type returns Empty for the same input, so sum and avg disagree with each other inside PowDB, and that sum over a float column with no rows returns Int(0) rather than Float(0.0). Reported as a finding; see the sprint report."
owner = "crates/query/src/executor/plan_exec/aggregate.rs:616"

[[divergence]]
id = "json-column-never-equals-a-string-literal"
shape = "json_whole_column_eq"
pair = "powql_vs_sqlite"
reason = "PowDB's Value equality is strictly typed, so a json column compared against a string literal is false for every row: `filter .j = \"{}\"` returns nothing, silently, with no type error. SQLite compares the stored JSON text and matches. Recorded, not excused: this is an open correctness question (either the literal should be coerced to json or the comparison should be a typed error) and it is reported as a probable engine bug rather than fixed here, because the fix is a semantics decision outside this lane."
owner = "crates/storage/src/types.rs:126"

[[divergence]]
id = "sql-string-literals-take-backslash-escapes"
shape = "sql_backslash_literal"
pair = "powql_vs_sqlite"
reason = "PowDB's SQL lexer treats a backslash as an escape introducer and collapses an unknown \\X to X, so the SQL text 'back\\slash' is the string backslash. Standard SQL and SQLite have no backslash escapes in string literals, so the same text is back\\slash there and matches a different row. This is inherited from the PowQL lexer for consistency between the two frontends, and it is undocumented; reported as a porting hazard."
owner = "crates/query/src/sql.rs:335"

[[divergence]]
id = "powql-eq-null-is-is-null"
shape = "cmp_against_null_literal"
pair = "powql_vs_sqlite"
reason = "PowQL deliberately desugars `x = null` / `x != null` to `x is null` / `x is not null` (crates/query/src/parser.rs, documented in docs/POWQL.md). SQL's three-valued logic makes the same text UNKNOWN, so SQLite selects no rows. This is a language design difference, not an engine bug: PowQL has no three-valued comparison to express, and rejecting the spelling outright would break the documented convenience. The SQL frontend does NOT inherit it -- it lowers a NULL comparison to a constant-false predicate so ported SQL keeps SQL meaning, which is what the owner line does."
owner = "crates/query/src/sql.rs:1687"
anchor = "rhs == \"null\""

[[divergence]]
id = "powql-eq-null-differs-from-powdb-sql"
shape = "cmp_against_null_literal"
pair = "powql_vs_powdb_sql"
reason = "The only accepted difference between PowDB's two frontends, and deliberate. `x = NULL` is not the same logical query in the two languages: in PowQL it is the documented spelling of `is null`, in SQL it is a comparison against UNKNOWN that selects nothing. Lowering both to the PowQL meaning would hand a silent wrong answer to anyone porting SQL in; lowering both to the SQL meaning would break PowQL's documented convenience. The plan trees differ only for this one source text; every other construct still lowers identically and any further entry for this pair should be read as an engine bug."
owner = "crates/query/src/sql.rs:1687"
anchor = "rhs == \"null\""
