[package]
name = "powdb"
description = "Embedded PowDB — run the PowDB engine in-process (no server, no socket), the SQLite-shaped front door to the same storage engine, indexes, and durability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["database", "powdb", "embedded", "sqlite", "local-first"]
categories = ["database", "database-implementations"]
documentation = "https://docs.rs/powdb"

[dependencies]
powdb-query = { version = "0.16.0", path = "../query" }
# Re-exported for `Value`, which appears in the public `QueryResult` API.
powdb-storage = { version = "0.16.0", path = "../storage" }
powdb-sync = { version = "0.16.0", path = "../sync" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
