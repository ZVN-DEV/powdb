[package]
name = "powdb-auth"
description = "Argon2 password hashing and a persisted user/role store for PowDB RBAC"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["database", "powdb", "auth", "rbac", "argon2"]
categories = ["database", "authentication"]
documentation = "https://docs.rs/powdb-auth"

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
