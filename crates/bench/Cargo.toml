[package]
name = "powdb-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
powdb-storage = { path = "../storage" }
powdb-query = { path = "../query" }
powdb-server = { path = "../server" }
powdb-auth = { path = "../auth" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"
powdb-storage = { path = "../storage" }
powdb-query = { path = "../query" }

[[bin]]
name = "smoke-bench"
path = "src/smoke.rs"
test = false

[[bin]]
name = "compare"
path = "src/bin/compare.rs"
test = false

# Standalone JSON-path-filter workload (design 4.4, B2). NOT part of the
# criterion regression gate or baseline/main.json (Depot-only policy): it just
# prints measured latency/throughput for the compiled inline leaf vs the decode
# fallback vs a flat-column ceiling. Run: `cargo run --release -p powdb-bench --bin json-filter`.
[[bin]]
name = "json-filter"
path = "src/bin/json_filter.rs"
test = false

# Synthetic Phase 0 read baseline. This is intentionally separate from the
# Criterion regression gate: it starts a real TCP server and reports observed
# remote latency plus 1/2/5/10-client scaling. Run in release mode.
[[bin]]
name = "phase0-read-baseline"
path = "src/bin/phase0_read_baseline.rs"
test = false

# Fixed-seed release proof for JSON-path equality/range indexes and bounded
# ordered expression-index scans. Emits machine-readable JSON and enforces
# relative speedup/scaling gates in release builds.
[[bin]]
name = "expression-index-release-gate"
path = "src/bin/expression_index_release_gate.rs"
test = false

# Declared explicitly (rather than auto-discovered) so it can opt out of being
# built as a test target: it is a benchmark driver with no #[test] functions.
[[bin]]
name = "compound_join_scaling"
path = "src/bin/compound_join_scaling.rs"
test = false

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "powql"
harness = false

[lints]
workspace = true
