# cargo-deny policy. CI splits this file across two jobs:
#   * the `deny` job runs `cargo deny check bans licenses sources`
#   * the `audit` job (rustsec/audit-check) gates advisories
# The [advisories] section below exists so that a full local `cargo deny check`
# reaches the same verdict CI does. That is only true if the list stays honest:
# cargo-deny reports a stale entry as `advisory-not-detected`, and an ignore
# list that suppresses nothing is a rubber stamp, so delete entries the moment
# they stop matching rather than leaving them to accumulate.

[advisories]
# This list is intentionally NOT a copy of `.cargo/audit.toml`. The two tools
# see different graphs: cargo-deny resolves features, so a dependency behind a
# disabled optional feature is invisible to it, while cargo-audit scans
# Cargo.lock and sees everything. `.cargo/audit.toml` therefore carries one ID
# (RUSTSEC-2026-0235, rkyv via the powdb-compare `mysql` optional feature) that
# must NOT be added here, because cargo-deny would report it as
# `advisory-not-detected`.
#
# The list is also short because cargo-deny's default `unmaintained =
# "workspace"` only errors on unmaintained crates we depend on DIRECTLY.
# Transitive unmaintained/unsound advisories (proc-macro-error2, lru, rand)
# surface as non-failing `cargo audit` warnings and are left visible on purpose.
#
# Nothing here may be an actual vulnerability. The single entry below is an
# unmaintained warning; if it ever becomes a vulnerability, fix the dependency
# instead of extending this list.
ignore = [
  # Unmaintained, NOT vulnerable: no CVE and no exploit path, the crate simply
  # stopped receiving updates. rustls-pemfile is a direct dependency of
  # powdb-server and powdb-cli, where it parses operator-supplied TLS cert/key
  # PEM files at startup. It never sees network input. The migration target is
  # the `PemObject` trait in rustls-pki-types >= 1.9.0, which is already in the
  # tree via tokio-rustls, so the fix is a real code change in both crates' TLS
  # setup rather than a version bump. Tracked as follow-up work; re-check this
  # entry when that lands.
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0 is unmaintained but not vulnerable; it only parses local operator-supplied TLS PEM files. Migration to rustls-pki-types PemObject is a code change, tracked separately." },
]

[licenses]
# Permissive-only allowlist covering the current dependency tree.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "Unlicense",
  "CC0-1.0",
  # webpki-roots ships the Mozilla CA root store as data under CDLA-Permissive-2.0
  # (a permissive data license). Pulled by the TLS stack and, under
  # --all-features, by the publish=false compare crate's mysql tree.
  "CDLA-Permissive-2.0",
]

[bans]
# Duplicate crate versions bloat builds but are not worth failing CI over.
multiple-versions = "warn"

[sources]
# Every dependency must come from crates.io: no git deps, no alt registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
