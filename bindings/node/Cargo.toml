# Standalone workspace — deliberately NOT a member of the root PowDB workspace.
# This artifact is built with `panic = "unwind"` so the embedded engine can
# `catch_unwind` at the FFI boundary and never abort the host Node process (the
# server's crate keeps `panic = "abort"`). An empty [workspace] table detaches
# this crate from the parent workspace so it gets its own profile.
[workspace]

[package]
name = "powdb-node"
# Tracks the workspace version even though this crate is publish = false and
# detached from the root workspace: it wraps that engine and ships as
# @zvndev/powdb-embedded at the same number. It drifted 17 minors sitting at
# 0.8.1, so scripts/check-version-consistency.sh now asserts it.
version = "0.27.0"
edition = "2021"
license = "MIT"
publish = false
description = "Node native addon (napi-rs) exposing the embedded PowDB engine in-process"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The embedded facade (in-process Database + panic-safe handle). Path dep on the
# sibling crates; rebuilt here under panic = "unwind".
powdb = { path = "../../crates/powdb" }
# `serde-json` lets napi map a `serde_json::Value` straight to a JS value, which
# is how a JSON result cell is handed back as a parsed JavaScript value (safe
# integers become JS numbers, out-of-range integers BigInt: matching the
# networked client's PJ1 decoder).
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
# Constructs the parsed `serde_json::Value` for a JSON cell (napi maps it to JS).
serde_json = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
panic = "unwind"
opt-level = 3
