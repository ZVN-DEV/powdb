# fly.toml — example PowDB deployment on Fly.io
#
# This is a template, not a live service. Copy it to your repo root, change
# `app` to one you own, then:
#
#   fly launch --copy-config --name <your-app-name>
#   fly volumes create powdb_data --region iad --size 1
#   fly secrets set POWDB_PASSWORD=<strong-secret>
#   fly deploy
#
# PowDB on Fly is a stateful TCP service (not HTTP). One machine, one
# persistent volume. Scaling out requires sharding/replication, which is out
# of scope for the current MVP.

app = "your-powdb-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  RUST_LOG = "info"
  POWDB_DATA = "/data"
  POWDB_PORT = "5433"
  # Phase 1 hardening: refuse to start when a password is set without TLS.
  # Leave OFF until you've mounted certs via secrets (POWDB_TLS_CERT /
  # POWDB_TLS_KEY) or fronted the service with a TLS-terminating proxy.
  POWDB_REQUIRE_TLS = "0"
  # Per-query memory budget (bytes). 256 MiB suits the default shared-cpu-1x VM.
  POWDB_QUERY_MEMORY_LIMIT = "268435456"

# Mount the persistent volume at /data so the database survives machine recycles.
[mounts]
  source = "powdb_data"
  destination = "/data"
  initial_size = "1gb"

# Raw TCP service on port 5433. No HTTP, no TLS termination — clients speak the
# native wire protocol directly.
[[services]]
  protocol = "tcp"
  internal_port = 5433
  auto_stop_machines = false   # database — stay up
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 5433

  [services.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 100

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
