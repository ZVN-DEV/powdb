# fly.toml — example PowDB deployment on Fly.io
#
# This is a template, not a live service. Copy it to your repo root, change
# `app` to one you own, then:
#
#   fly launch --copy-config --name <your-app-name>
#   fly volumes create powdb_data --region iad --size 1
#   fly secrets set POWDB_PASSWORD=<strong-secret>
#   fly deploy
#
# PowDB on Fly is a stateful TCP service (not HTTP). One machine, one
# persistent volume. Scaling out requires sharding/replication, which is out
# of scope for the current MVP.

app = "your-powdb-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  RUST_LOG = "info"
  POWDB_DATA = "/data"
  POWDB_PORT = "5433"
  # Bind all interfaces — the server defaults to 127.0.0.1, which Fly's proxy can't reach.
  POWDB_BIND = "0.0.0.0"
  # Phase 1 hardening: refuse to start when a password is set without TLS.
  # Leave OFF until you've mounted certs via secrets (POWDB_TLS_CERT /
  # POWDB_TLS_KEY) or fronted the service with a TLS-terminating proxy.
  POWDB_REQUIRE_TLS = "0"
  # Per-query memory budget (bytes) — 64 MiB.
  #
  # IMPORTANT: this is the cap for a SINGLE query's sort/join/group/IN-list
  # materialization, NOT a global process budget. With the 256 MB VM below
  # and hard_limit = 32 connections, worst-case = 32 × 64 MiB = 2 GiB, which
  # would OOM-kill the machine. In practice the VM survives because most
  # queries use far less than the cap, but it MUST be sized for your real
  # workload. Bump the VM to 512 MB / 1 GB if you raise this. See the
  # "Production checklist" in README.md for the per-query × concurrency math.
  POWDB_QUERY_MEMORY_LIMIT = "67108864"

# Mount the persistent volume at /data so the database survives machine recycles.
[mounts]
  source = "powdb_data"
  destination = "/data"
  initial_size = "1gb"

# Raw TCP service on port 5433. No HTTP, no TLS termination — clients speak the
# native wire protocol directly.
[[services]]
  protocol = "tcp"
  internal_port = 5433
  auto_stop_machines = false   # database — stay up
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 5433

  # Concurrency cap aligned with POWDB_QUERY_MEMORY_LIMIT × VM memory:
  # 32 conns × 64 MiB/query = 2 GiB worst case (rare). Tune for your workload.
  [services.concurrency]
    type = "connections"
    hard_limit = 32
    soft_limit = 16

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
