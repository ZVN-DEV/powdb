name: publish

# Publishes PowDB crates to crates.io in dependency order.
#
# Requires the CARGO_REGISTRY_TOKEN repository secret to be set.
# Generate a token at https://crates.io/settings/tokens with "publish-update"
# scope, then add it at Settings > Secrets > Actions > CARGO_REGISTRY_TOKEN.
#
# Usage:
#   - Trigger manually via workflow_dispatch with a version string
#   - Set dry_run to true (default) to validate without publishing
#   - Set dry_run to false to publish for real

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.3.0). Must match Cargo.toml versions."
        required: true
        type: string
      dry_run:
        description: "Dry run (validate only, do not publish)"
        required: true
        type: boolean
        default: true

permissions: {}

jobs:
  publish:
    name: publish crates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # The repo's .cargo/config.toml sets `target-cpu=native` for local M1 dev.
      # On GitHub's heterogeneous shared-runner fleet that flag makes rustc emit
      # instructions the underlying (often live-migrated) silicon can't execute,
      # so the verification build dies with SIGILL. Every other workflow
      # (ci/release/bench) overrides it with a portable baseline; publish.yml was
      # the one that didn't. Match them so the publish gate is reproducible.
      RUSTFLAGS: "-C target-cpu=x86-64-v2"

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: publish-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            publish-${{ runner.os }}-

      - name: Verify version matches input
        run: |
          # Crates use version.workspace = true, so check the workspace root
          # against the manually supplied release input as a second guardrail.
          ws_version="$(python3 -c 'from pathlib import Path; import re; text=Path("Cargo.toml").read_text(); m=re.search(r"\[workspace\.package\](.*?)(?:\n\[|\Z)", text, re.S); vm=re.search(r"^version\s*=\s*\"([^\"]+)\"", m.group(1), re.M) if m else None; print(vm.group(1) if vm else "")')"
          if [ "$ws_version" != "${{ inputs.version }}" ]; then
            echo "::error::workspace version ($ws_version) does not match input (${{ inputs.version }})"
            exit 1
          fi
          echo "Workspace version matches ${{ inputs.version }}"

      - name: Check repository version consistency
        run: bash scripts/check-version-consistency.sh

      - name: Enable pnpm from packageManager
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate

      - name: Run tests
        run: cargo test --workspace

      - name: Package smoke (npm pack + cargo package list)
        run: bash scripts/smoke-package.sh

      # Publish in the RELEASES.md dependency order. Each crate must be indexed
      # by crates.io before the next dependent crate can be published. The
      # sleep gives the index time to propagate.

      - name: Publish powdb-storage
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish -p powdb-storage --dry-run
          else
            cargo publish -p powdb-storage
            echo "Waiting for crates.io to index powdb-storage..."
            sleep 30
          fi

      # powdb-auth is a leaf (argon2 etc., no powdb deps) but powdb-server
      # depends on it, so publish it before query/server to match RELEASES.md.
      - name: Publish powdb-auth
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish -p powdb-auth --dry-run
          else
            cargo publish -p powdb-auth
            echo "Waiting for crates.io to index powdb-auth..."
            sleep 30
          fi

      - name: Publish powdb-query
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish -p powdb-query --dry-run
          else
            cargo publish -p powdb-query
            echo "Waiting for crates.io to index powdb-query..."
            sleep 30
          fi

      # powdb-backup depends on storage+query (both already published above)
      # and powdb-cli depends on backup, so it must precede the cli.
      - name: Publish powdb-backup
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish -p powdb-backup --dry-run
          else
            cargo publish -p powdb-backup
            echo "Waiting for crates.io to index powdb-backup..."
            sleep 30
          fi

      - name: Publish powdb-server
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish -p powdb-server --dry-run
          else
            cargo publish -p powdb-server
            echo "Waiting for crates.io to index powdb-server..."
            sleep 30
          fi

      - name: Publish powdb-cli
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish -p powdb-cli --dry-run
          else
            cargo publish -p powdb-cli
          fi

      - name: Summary
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "## Dry run complete" >> "$GITHUB_STEP_SUMMARY"
            echo "All crates validated for v${{ inputs.version }}. Re-run with dry_run=false to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Published to crates.io" >> "$GITHUB_STEP_SUMMARY"
            echo "- powdb-storage v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- powdb-query v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- powdb-auth v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- powdb-backup v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- powdb-server v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- powdb-cli v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          fi
