name: publish

# Publishes PowDB crates to crates.io in dependency order.
#
# Requires the CARGO_REGISTRY_TOKEN repository secret to be set.
# Generate a token at https://crates.io/settings/tokens with "publish-update"
# scope, then add it at Settings > Secrets > Actions > CARGO_REGISTRY_TOKEN.
#
# Usage:
#   - Trigger manually via workflow_dispatch with a version string
#   - Set dry_run to true (default) to validate without publishing
#   - Set dry_run to false to publish for real

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.3.0). Must match Cargo.toml versions."
        required: true
        type: string
      dry_run:
        description: "Dry run (validate only, do not publish)"
        required: true
        type: boolean
        default: true

permissions: {}

jobs:
  publish:
    name: publish crates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: publish-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            publish-${{ runner.os }}-

      - name: Verify version matches input
        run: |
          # Crates use version.workspace = true, so check the workspace root.
          ws_version=$(sed -n '/\[workspace\.package\]/,/^\[/{ s/^version = "\(.*\)"/\1/p; }' Cargo.toml)
          if [ "$ws_version" != "${{ inputs.version }}" ]; then
            echo "::error::workspace version ($ws_version) does not match input (${{ inputs.version }})"
            exit 1
          fi
          echo "Workspace version matches ${{ inputs.version }}"

      - name: Run tests
        run: cargo test --workspace

      # Publish in dependency order. Each crate must be indexed by crates.io
      # before the next dependent crate can be published. The sleep gives the
      # index time to propagate.

      - name: Publish powdb-storage
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish -p powdb-storage --dry-run
          else
            cargo publish -p powdb-storage
            echo "Waiting for crates.io to index powdb-storage..."
            sleep 30
          fi

      - name: Publish powdb-query
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish -p powdb-query --dry-run
          else
            cargo publish -p powdb-query
            echo "Waiting for crates.io to index powdb-query..."
            sleep 30
          fi

      - name: Publish powdb-server
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish -p powdb-server --dry-run
          else
            cargo publish -p powdb-server
            echo "Waiting for crates.io to index powdb-server..."
            sleep 30
          fi

      - name: Publish powdb-cli
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish -p powdb-cli --dry-run
          else
            cargo publish -p powdb-cli
          fi

      - name: Summary
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "## Dry run complete" >> "$GITHUB_STEP_SUMMARY"
            echo "All crates validated for v${{ inputs.version }}. Re-run with dry_run=false to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Published to crates.io" >> "$GITHUB_STEP_SUMMARY"
            echo "- powdb-storage v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- powdb-query v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- powdb-server v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- powdb-cli v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          fi
