name: publish-node-addon

# Publishes @zvndev/powdb-embedded (the embedded Node native addon) to npm.
#
# Distribution model: a single package that bundles the prebuilt .node binary
# for every supported platform (built natively, one per runner). The napi
# loader (index.js) resolves the local `powdb-embedded.<platform>.node` at
# runtime, so no per-platform sub-packages / optionalDependencies are needed —
# one npm package, one trusted-publisher config.
#
# Token-less via npm Trusted Publishing (OIDC). No NPM token is stored — the
# publish job proves identity to npm via the workflow's GitHub OIDC token.
# Requires a trusted publisher configured ONCE on npmjs.com for
# @zvndev/powdb-embedded (owner ZVN-DEV, repo powdb, workflow
# publish-node-addon.yml). See docs/ci/trusted-publishing.md.
#
# Usage:
#   - Trigger manually via workflow_dispatch with the version string.
#   - dry_run = true (default) packs every platform but does NOT publish, so it
#     needs no OIDC setup and is safe to run anytime to validate the matrix.
#   - dry_run = false publishes for real.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match bindings/node/package.json)"
        required: true
        type: string
      dry_run:
        description: "Dry run (pack only, do not publish)"
        required: true
        type: boolean
        default: true

permissions: {}

jobs:
  build:
    name: build addon (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            rustflags: ""
          - os: macos-13
            target: x86_64-apple-darwin
            rustflags: "-C target-cpu=x86-64-v2"
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rustflags: "-C target-cpu=x86-64-v2"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rustflags: ""
          # Windows (x86_64-pc-windows-msvc) is intentionally omitted: the
          # storage engine uses Unix-only APIs directly (std::os::unix, raw
          # libc mmap/munmap, AsRawFd), so it does not compile on Windows yet
          # (deferred Windows phase). Re-add once the engine is ported.
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install addon dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Build native addon (release, portable)
        working-directory: bindings/node
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: npm run build

      - name: Upload addon artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: addon-${{ matrix.target }}
          path: |
            bindings/node/index.js
            bindings/node/index.d.ts
            bindings/node/*.node

  publish:
    name: publish to npm (OIDC trusted publishing)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # prove identity to npm via OIDC (no stored token)

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (trusted publishing requires npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Verify version matches input
        working-directory: bindings/node
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${{ inputs.version }}" ]; then
            echo "::error::bindings/node/package.json ($pkg) does not match input (${{ inputs.version }})"
            exit 1
          fi
          echo "package.json version matches ${{ inputs.version }}"

      - name: Download all platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bindings/node
          merge-multiple: true

      - name: Verify all platform binaries are present
        working-directory: bindings/node
        run: |
          set -euo pipefail
          count="$(ls -1 ./*.node 2>/dev/null | wc -l | tr -d ' ')"
          echo "Found $count platform binaries:"
          ls -1 ./*.node
          if [ "$count" -ne 4 ]; then
            echo "::error::expected 4 platform .node binaries (macOS arm64/x64, Linux x64/arm64; Windows deferred), found $count — refusing to publish a partial set"
            exit 1
          fi
          test -f index.js || { echo "::error::index.js (napi loader) missing"; exit 1; }

      - name: Publish to npm (token-less, with provenance)
        if: ${{ inputs.dry_run == false }}
        working-directory: bindings/node
        run: npm publish --provenance --access public

      - name: Dry run (pack only)
        if: ${{ inputs.dry_run == true }}
        working-directory: bindings/node
        run: npm publish --dry-run

      - name: Summary
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "## Dry run complete" >> "$GITHUB_STEP_SUMMARY"
            echo "Built + packed @zvndev/powdb-embedded v${{ inputs.version }} for all 4 platforms. Re-run with dry_run=false to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Published @zvndev/powdb-embedded v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Single package with prebuilt binaries for macOS (arm64/x64), Linux (x64/arm64). Windows deferred (Unix-only engine)." >> "$GITHUB_STEP_SUMMARY"
          fi
