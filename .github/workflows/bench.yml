name: bench

# Heavy criterion microbenchmark suite — DELIBERATELY NOT in the required
# CI / release pipeline.
#
# Why it's manual-only:
#   - It's slow (~6 min on GitHub NVMe, far worse on overlay-FS runners) and
#     resource-heavy (mmap-based heap scans), so it's a poor merge gate.
#   - On shared runners the absolute thresholds are dominated by per-VM
#     timing noise (±30–56%), producing false regressions.
#   - powdb-bench depends only on powdb-storage + powdb-query, so it gates
#     nothing the normal CI suite doesn't already cover for correctness.
#
# How to use it: trigger on demand (Actions tab → "bench" → Run workflow, or
# `gh workflow run bench.yml`). For trustworthy numbers, run it on real,
# single-tenant deployment hardware rather than a shared CI runner. It is NOT
# a required status check on `main`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: criterion + regression gate (manual)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      # Portable x86-64-v2 baseline (SSE3/SSSE3/SSE4.1/SSE4.2/POPCNT) so a
      # cached binary can't SIGILL across the shared pool's CPU generations.
      RUSTFLAGS: "-C target-cpu=x86-64-v2"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-${{ runner.os }}-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            bench-${{ runner.os }}-v2-

      - name: Print rustc version
        run: rustc --version

      - name: Build bench targets
        run: cargo bench -p powdb-bench --no-run

      - name: Run criterion bench suite
        run: cargo bench -p powdb-bench --quiet

      - name: Run regression gate comparator
        run: cargo run -p powdb-bench --bin compare --quiet

      - name: Upload criterion estimates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: criterion-estimates
          path: target/criterion/*/new/estimates.json
          retention-days: 14
