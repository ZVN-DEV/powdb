name: bench

# PowDB regression gate. Runs the criterion suite on every PR to main and on
# pushes to main. Comparator exits non-zero on regression beyond the gate
# thresholds (7% per-workload absolute, 2.5x ratio ceiling on the thesis
# metric).
#
# See docs/superpowers/specs/2026-04-07-bench-regression-gate-design.md
# and the "Bench regression gate" section of AGENTS.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

# Cancel in-progress runs on the same branch when a new commit lands. Bench
# runs are expensive and the older one's results would be wasted anyway.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: criterion + regression gate
    # Depot single-tenant runners: a dedicated CPU per job (no noisy
    # neighbours) on a consistent host CPU model. This is what makes the
    # criterion gate trustworthy — GitHub's shared `ubuntu-24.04` pool is a
    # heterogeneous mix of Azure VMs whose per-job timing swung ±30–56% on
    # whichever workload landed next to a noisy neighbour, tripping the
    # absolute thresholds at random (runs 27080564701, 27080616086,
    # 27081630605 each failed a *different* workload with no code change).
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      # Override `.cargo/config.toml`'s `-C target-cpu=native` with a
      # portable x86-64-v2 baseline (SSE3/SSSE3/SSE4.1/SSE4.2/POPCNT).
      # Even on Depot's consistent hosts we keep this conservative: the
      # cargo `target/` cache is keyed on Cargo.lock, not CPU model, so a
      # cached binary built with `target-cpu=native` could still SIGILL if
      # Depot ever shifts the underlying CPU class. `x86-64-v2` is the
      # widest baseline that still lets crc32fast use its SSE4.2 SIMD path
      # (runtime-detected), so there's no perf floor lost on the WAL path.
      RUSTFLAGS: "-C target-cpu=x86-64-v2"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Cache key is suffixed `-v2` to bust any stale `target/` built
          # under `target-cpu=native` on a previous runner — the old cache
          # contained a binary with AVX-512 instructions that crashed on
          # Skylake-era runners (see SIGILL on run 24210833296).
          key: bench-${{ runner.os }}-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            bench-${{ runner.os }}-v2-

      - name: Print rustc version
        run: rustc --version

      - name: Build bench targets
        run: cargo bench -p powdb-bench --no-run

      - name: Run criterion bench suite
        run: cargo bench -p powdb-bench --quiet

      - name: Run regression gate comparator
        run: cargo run -p powdb-bench --bin compare --quiet

      # Always upload (not just on failure): the estimates are how we
      # re-center `baseline/main.json` on the current runner hardware and
      # diagnose a flake after the fact. They're tiny (~10KB).
      - name: Upload criterion estimates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: criterion-estimates
          path: target/criterion/*/new/estimates.json
          retention-days: 14
