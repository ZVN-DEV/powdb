name: release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zvn-dev/powdb

jobs:
  test:
    name: test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-test-${{ runner.os }}-

      # `--locked` matches ci.yml. This workflow builds the artifacts users
      # download, so resolving a dependency set CI never saw is worse here
      # than anywhere else in the repo.
      - name: Run tests
        run: cargo test --workspace --locked

      - name: Package smoke (npm pack + cargo package list)
        run: bash scripts/smoke-package.sh

      # Validate the release body HERE, in the one job everything else depends
      # on, rather than in the `release` job. `release` is a sibling of
      # `npm-publish`, `npm-publish-sync` and `docker`, so a changelog problem
      # discovered there surfaces only after those irreversible publishes have
      # already run. A tag whose version has no changelog section must fail
      # before anything ships, not after.
      - name: Release body is extractable from the changelog
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::tag $tag is not a vX.Y.Z release tag; the release body will fall back to generated notes"
            exit 0
          fi
          bash scripts/ci/changelog-section.sh "$version" > /dev/null
          echo "changelog section for $version is present and non-empty"

  build:
    name: build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          # Explicit portable baseline for the SHIPPED linux binary: released
          # artifacts must run on any x86-64-v2 CPU, not just the build host.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            rustflags: "-C target-cpu=x86-64-v2"
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-aarch64
            rustflags: ""
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.target }}-

      - name: Build release binaries
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p powdb-cli -p powdb-server

      - name: Rename binaries
        run: |
          mv target/${{ matrix.target }}/release/powdb-cli powdb-cli-${{ matrix.suffix }}
          mv target/${{ matrix.target }}/release/powdb-server powdb-server-${{ matrix.suffix }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.suffix }}
          path: |
            powdb-cli-${{ matrix.suffix }}
            powdb-server-${{ matrix.suffix }}

  smoke-release:
    name: durability smoke (release binary)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      # Kept explicit: portable target-cpu so the binary we smoke matches the
      # published linux-x86_64 artifact built above.
      RUSTFLAGS: "-C target-cpu=x86-64-v2"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Share the linux-x86_64 build cache so we reuse the binaries the
          # `build` job already compiled instead of rebuilding from scratch.
          key: release-x86_64-unknown-linux-gnu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-x86_64-unknown-linux-gnu-

      - name: Build release binaries (powdb-cli + powdb-server)
        run: cargo build --release --locked -p powdb-cli -p powdb-server

      # The gate whose absence caused the v0.4.1–0.4.3 data-loss yanks:
      # README PowQL flow + unique-constraint enforcement + kill -9/restart
      # WAL-replay recovery, all over the wire against the freshly built
      # release binary. Must print SMOKE-RELEASE: ALL-PASS.
      - name: Durability smoke against release binary
        run: bash scripts/smoke-release.sh

  npm-package-smoke:
    name: TypeScript npm package smoke
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check repository version consistency
        run: bash scripts/check-version-consistency.sh

      - name: npm pack dry-run
        working-directory: clients/ts
        run: |
          npm exec --yes --package=pnpm@10.29.3 -- pnpm install --frozen-lockfile
          npm exec --yes --package=pnpm@10.29.3 -- pnpm build
          npm pack --dry-run

  npm-publish:
    name: publish to npm (OIDC trusted publishing)
    needs: [build, smoke-release, npm-package-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Token-less publish via npm Trusted Publishing. No NPM secret is stored
    # anywhere — the job proves its identity to npm with a short-lived OIDC
    # token. Requires a trusted publisher configured once on npmjs.com for
    # @zvndev/powdb-client (org: ZVN-DEV, repo: powdb, workflow: release.yml).
    # See docs/ci/trusted-publishing.md.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Pinned, not `npm@latest`: this step runs in the job that mints the npm
      # publish credential via OIDC, and it was the only unpinned dependency
      # fetch in an otherwise fully SHA-pinned pipeline. 11.5.1 is the first
      # release that supports trusted publishing. Bump deliberately.
      - name: Upgrade npm (trusted publishing requires npm >= 11.5.1)
        run: npm install -g npm@11.5.1

      - name: Verify git tag matches package.json version
        working-directory: clients/ts
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::git tag v$tag does not match clients/ts/package.json ($pkg)"
            exit 1
          fi
          echo "tag v$tag matches package.json version"

      - name: Install dependencies and build
        working-directory: clients/ts
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Classify the release channel (final vs rc)
        id: channel
        run: bash scripts/ci/release-channel.sh "${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # An rc publishes under the `next` dist-tag so `npm install
      # @zvndev/powdb-client` keeps resolving the last final release.
      - name: Publish to npm (token-less, with provenance)
        working-directory: clients/ts
        run: npm publish --provenance --access public --tag "${{ steps.channel.outputs.npm_tag }}"

  npm-publish-sync:
    name: publish @zvndev/powdb-sync to npm (OIDC trusted publishing)
    needs: [build, smoke-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Same token-less OIDC publish as npm-publish above, for the experimental
    # sync orchestration package. Requires a trusted publisher configured once
    # on npmjs.com for @zvndev/powdb-sync (org: ZVN-DEV, repo: powdb, workflow:
    # release.yml, env: npm-publish).
    #
    # The package has never been published, and npm cannot configure a trusted
    # publisher for a name that does not exist yet, so the first publish has to
    # be a manual `npm publish` (see docs/ci/trusted-publishing.md). Until that
    # bootstrap happens this job WARNS and skips rather than failing, so an
    # unbootstrapped optional package cannot redden a release that is otherwise
    # complete. It starts publishing on its own the moment the name exists.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (trusted publishing requires npm >= 11.5.1)
        run: npm install -g npm@11.5.1

      - name: Verify git tag matches package.json version
        working-directory: clients/sync
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::git tag v$tag does not match clients/sync/package.json ($pkg)"
            exit 1
          fi
          echo "tag v$tag matches package.json version"

      # The peer pins are exact, so a stale one would publish a package that
      # demands versions nobody released. check-version-consistency.sh enforces
      # this on every PR; re-check here because publishing is irreversible.
      - name: Verify peer pins match this release
        working-directory: clients/sync
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          for peer in @zvndev/powdb-client @zvndev/powdb-embedded; do
            pin="$(node -p "require('./package.json').peerDependencies['$peer']")"
            if [ "$pin" != "$tag" ]; then
              echo "::error::peerDependency $peer pins $pin, expected $tag"
              exit 1
            fi
          done
          echo "peer pins match $tag"

      - name: Has this package been bootstrapped on npm?
        id: exists
        run: |
          if npm view @zvndev/powdb-sync version >/dev/null 2>&1; then
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
            echo "::warning::@zvndev/powdb-sync is not on npm yet, so this release does not include it. Publish it once by hand (npm publish --access public from clients/sync), then add the trusted publisher on npmjs.com; this job takes over from the next release."
          fi

      - name: Install dependencies, build and test
        if: steps.exists.outputs.bootstrapped == 'true'
        working-directory: clients/sync
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test

      - name: Classify the release channel (final vs rc)
        id: channel
        run: bash scripts/ci/release-channel.sh "${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (token-less, with provenance)
        if: steps.exists.outputs.bootstrapped == 'true'
        working-directory: clients/sync
        run: npm publish --provenance --access public --tag "${{ steps.channel.outputs.npm_tag }}"

  release:
    name: create release
    needs: [build, smoke-release, npm-package-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Required to mint the signing certificate for build provenance.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Classify the release channel (final vs rc)
        id: channel
        run: bash scripts/ci/release-channel.sh "${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # Integrity manifest for the downloadable binaries. Users can verify a
      # download with `sha256sum -c SHA256SUMS`. Generated from inside the
      # artifacts dir so the file lists bare names, not `artifacts/` paths.
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS.tmp
          mv SHA256SUMS.tmp SHA256SUMS
          cat SHA256SUMS

      # SHA256SUMS proves the files match each other; it does not prove where
      # they came from, and it is served from the same page as the binaries, so
      # anyone who can replace one can replace both. Signed provenance ties each
      # binary to the workflow run and commit that produced it. npm publishes
      # already carry --provenance and crates.io publishes are OIDC; the two
      # channels a user can curl had nothing. Verify a download with:
      #   gh attestation verify powdb-cli-linux-x86_64 --repo ZVN-DEV/powdb
      - name: Attest build provenance for the release binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*

      # `generate_release_notes: true` on its own made the entire v0.25.0 release
      # body one auto-generated bullet linking a PR, while the curated 95-line
      # CHANGELOG entry (which described a defect that permanently bricked data
      # directories) never reached the page most users read. Passing an explicit
      # body keeps the curated notes first; GitHub still appends the generated
      # PR list underneath because generate_release_notes stays on.
      #
      # The extractor fails the release if the section is missing or empty
      # rather than publishing a blank body.
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          notes="${RUNNER_TEMP}/release-notes.md"
          # A prerelease tag (v0.26.0-rc1) has no changelog section of its own.
          # Fall back to generated notes rather than failing: by this point the
          # npm and ghcr publishes have already run, so failing here would leave
          # a release with published packages and no GitHub Release at all. The
          # `test` job already hard-fails a vX.Y.Z tag with no section, which is
          # the case that must never ship.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            bash scripts/ci/changelog-section.sh "$version" > "$notes"
            echo "path=$notes" >> "$GITHUB_OUTPUT"
            echo "Release body ($(wc -l < "$notes") lines):"
            cat "$notes"
          else
            echo "::notice::$version is not a release version; using generated notes only"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      # An rc is a GitHub pre-release: it never takes the "Latest" badge that
      # the install docs and `gh release download` without a tag rely on.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          files: artifacts/*

  docker:
    name: docker image
    # The container channel ships the same engine as the tarball binaries, so it
    # must clear the same durability gate. PowDB yanked v0.4.1 through v0.4.3 for
    # data loss and `smoke-release` (kill -9 plus WAL replay) exists because of
    # that incident: publishing the image on `test` alone left Docker users
    # unguarded against the exact failure mode that already happened once.
    needs: [test, smoke-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Required to mint the signing certificate for build provenance.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `version` is the image tag (v0.23.0); `semver` drops the leading v for
      # the OCI org.opencontainers.image.version label, which the spec defines
      # as the version of the packaged software; `created` is the RFC 3339 build
      # timestamp the OCI spec asks for. All three feed the Dockerfile's build
      # args so `docker inspect` can map a running container back to a commit.
      - name: Extract tag name
        id: tag
        run: |
          set -euo pipefail
          {
            echo "version=${GITHUB_REF#refs/tags/}"
            echo "semver=${GITHUB_REF#refs/tags/v}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # An rc moves the `rc` floating tag, never `latest`, so `docker pull
      # ghcr.io/zvn-dev/powdb` keeps serving the last final release.
      - name: Classify the release channel (final vs rc)
        id: channel
        run: bash scripts/ci/release-channel.sh "${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.channel.outputs.docker_floating_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
          # Populates the dynamic OCI labels declared at the end of the
          # Dockerfile. Without these the image ships the placeholder defaults
          # (0.0.0-dev / unknown), which is the honest answer for a local build
          # but not for a published release.
          build-args: |
            VERSION=${{ steps.tag.outputs.semver }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.tag.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Attested by digest, not by tag: `latest` and `vX.Y.Z` are mutable
      # pointers, and the digest is what a puller actually resolves to.
      # `push-to-registry` stores the attestation alongside the image so it can
      # be verified without this repository:
      #   gh attestation verify oci://ghcr.io/zvn-dev/powdb:vX.Y.Z --repo ZVN-DEV/powdb
      - name: Attest build provenance for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
