name: release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zvn-dev/powdb

jobs:
  test:
    name: test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-test-${{ runner.os }}-

      - name: Run tests
        run: cargo test --workspace

      - name: Package smoke (npm pack + cargo package list)
        run: bash scripts/smoke-package.sh

  build:
    name: build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          # Explicit portable baseline for the SHIPPED linux binary: released
          # artifacts must run on any x86-64-v2 CPU, not just the build host.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            rustflags: "-C target-cpu=x86-64-v2"
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-aarch64
            rustflags: ""
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.target }}-

      - name: Build release binaries
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }} -p powdb-cli -p powdb-server

      - name: Rename binaries
        run: |
          mv target/${{ matrix.target }}/release/powdb-cli powdb-cli-${{ matrix.suffix }}
          mv target/${{ matrix.target }}/release/powdb-server powdb-server-${{ matrix.suffix }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.suffix }}
          path: |
            powdb-cli-${{ matrix.suffix }}
            powdb-server-${{ matrix.suffix }}

  smoke-release:
    name: durability smoke (release binary)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      # Kept explicit: portable target-cpu so the binary we smoke matches the
      # published linux-x86_64 artifact built above.
      RUSTFLAGS: "-C target-cpu=x86-64-v2"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Share the linux-x86_64 build cache so we reuse the binaries the
          # `build` job already compiled instead of rebuilding from scratch.
          key: release-x86_64-unknown-linux-gnu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-x86_64-unknown-linux-gnu-

      - name: Build release binaries (powdb-cli + powdb-server)
        run: cargo build --release -p powdb-cli -p powdb-server

      # The gate whose absence caused the v0.4.1–0.4.3 data-loss yanks:
      # README PowQL flow + unique-constraint enforcement + kill -9/restart
      # WAL-replay recovery, all over the wire against the freshly built
      # release binary. Must print SMOKE-RELEASE: ALL-PASS.
      - name: Durability smoke against release binary
        run: bash scripts/smoke-release.sh

  npm-package-smoke:
    name: TypeScript npm package smoke
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check repository version consistency
        run: bash scripts/check-version-consistency.sh

      - name: npm pack dry-run
        working-directory: clients/ts
        run: |
          npm exec --yes --package=pnpm@10.29.3 -- pnpm install --frozen-lockfile
          npm exec --yes --package=pnpm@10.29.3 -- pnpm build
          npm pack --dry-run

  npm-publish:
    name: publish to npm (OIDC trusted publishing)
    needs: [build, smoke-release, npm-package-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Token-less publish via npm Trusted Publishing. No NPM secret is stored
    # anywhere — the job proves its identity to npm with a short-lived OIDC
    # token. Requires a trusted publisher configured once on npmjs.com for
    # @zvndev/powdb-client (org: ZVN-DEV, repo: powdb, workflow: release.yml).
    # See docs/ci/trusted-publishing.md.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (trusted publishing requires npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Verify git tag matches package.json version
        working-directory: clients/ts
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::git tag v$tag does not match clients/ts/package.json ($pkg)"
            exit 1
          fi
          echo "tag v$tag matches package.json version"

      - name: Install dependencies and build
        working-directory: clients/ts
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Publish to npm (token-less, with provenance)
        working-directory: clients/ts
        run: npm publish --provenance --access public

  release:
    name: create release
    needs: [build, smoke-release, npm-package-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          generate_release_notes: true
          files: artifacts/*

  docker:
    name: docker image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Extract tag name
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
