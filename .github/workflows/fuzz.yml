name: fuzz

on:
  pull_request:
    paths:
      - "crates/query/src/lexer.rs"
      - "crates/query/src/parser.rs"
      - "crates/query/src/token.rs"
      - "crates/query/src/canonicalize.rs"
      - "crates/query/fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    # Nightly smoke at 07:00 UTC — longer budget than PR runs.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-smoke:
    name: fuzz ${{ matrix.target }} (${{ matrix.budget }}s)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_lexer, fuzz_parser, fuzz_roundtrip, fuzz_sql]
        include:
          - target: fuzz_lexer
            budget: 60
          - target: fuzz_parser
            budget: 60
          - target: fuzz_roundtrip
            budget: 60
          - target: fuzz_sql
            budget: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          # cargo-fuzz needs nightly (`-Z sanitizer`). The channel is derived
          # from the action ref, but this step pins the action to a SHA (for
          # supply-chain safety), and a SHA can't convey "nightly" — so without
          # this explicit input the action installs *stable* and every fuzz
          # build fails with "the option `Z` is only accepted on nightly".
          # Setting it explicitly keeps fuzz working across dependabot SHA bumps.
          toolchain: nightly

      - name: Cargo cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/query/fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('crates/query/fuzz/Cargo.lock') }}
          restore-keys: |
            fuzz-${{ runner.os }}-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      # `cargo fuzz` expects `<crate>/fuzz/Cargo.toml` relative to its cwd,
      # so we run from `crates/query` (the crate under test), not from
      # `crates/query/fuzz` itself.
      - name: Run ${{ matrix.target }} for ${{ matrix.budget }}s
        working-directory: crates/query
        run: |
          cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time=${{ matrix.budget }} \
            -timeout=5 \
            -max_len=2048 \
            -print_final_stats=1

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: crates/query/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
