name: fuzz

on:
  pull_request:
    # This allowlist is hand-maintained, which means it is a list of what
    # somebody remembered. It used to stop at the front end (lexer, parser,
    # sql, pj1, wal, catalog, protocol) and therefore excluded the planner, the
    # executor, the heap and the B-tree: a change to any of them could not
    # trigger a fuzz run, and those four are where every shipped P0 in this
    # engine has lived. The engine files below close that hole. The
    # deterministic corpus replay in ci.yml runs on EVERY pull request
    # regardless of paths, so this filter now only decides who gets the extra
    # exploratory campaign, not who gets fuzzed at all.
    paths:
      - "crates/query/src/lexer.rs"
      - "crates/query/src/parser.rs"
      # The SQL frontend is wire-reachable (QuerySql) and has already shipped a
      # parser DoS, so `fuzz_sql` must run when this file changes.
      - "crates/query/src/sql.rs"
      - "crates/query/src/token.rs"
      - "crates/query/src/canonicalize.rs"
      # Engine interior: reached by fuzz_execute through real PowQL, and by
      # fuzz_catalog_open / fuzz_wal_replay through real on-disk files.
      - "crates/query/src/planner.rs"
      - "crates/query/src/plan.rs"
      - "crates/query/src/executor/**"
      - "crates/storage/src/heap.rs"
      - "crates/storage/src/btree.rs"
      - "crates/storage/src/page.rs"
      - "crates/storage/src/row.rs"
      - "crates/storage/src/pj1.rs"
      - "crates/server/src/protocol.rs"
      - "crates/storage/src/wal.rs"
      - "crates/storage/src/catalog/**"
      - "crates/query/fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    # Nightly smoke at 07:00 UTC. Nightly (and manual) runs get a longer
    # per-target budget than PR runs, see FUZZ_BUDGET below.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-smoke:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            fuzz_lexer,
            fuzz_parser,
            fuzz_roundtrip,
            fuzz_sql,
            fuzz_pj1,
            fuzz_wire,
            fuzz_wal_replay,
            fuzz_execute,
            fuzz_catalog_open,
            fuzz_sync_segment,
            fuzz_btree_open,
          ]
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      # PR runs stay a fast 60s-per-target smoke so they do not slow reviews.
      # The nightly cron (and manual dispatches) run 5 minutes per target, which
      # is what the header means by "longer budget": paired with the cached
      # corpus below, each nightly starts from the accumulated corpus and pushes
      # coverage further instead of re-exploring shallow inputs every time.
      FUZZ_BUDGET: ${{ github.event_name == 'pull_request' && '60' || '300' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          # cargo-fuzz needs nightly (`-Z sanitizer`). The channel is derived
          # from the action ref, but this step pins the action to a SHA (for
          # supply-chain safety), and a SHA can't convey "nightly" — so without
          # this explicit input the action installs *stable* and every fuzz
          # build fails with "the option `Z` is only accepted on nightly".
          # Setting it explicitly keeps fuzz working across dependabot SHA bumps.
          #
          # The pin is a DATED nightly rather than plain "nightly" on purpose: a
          # campaign whose compiler changes under it cannot be compared run to
          # run, and a floating nightly has already turned main red once when
          # the rust-lang dist publish window opened mid-run. The
          # `nightly-pin-freshness` job below fails as soon as this pin passes
          # 45 days, so the pin cannot rot silently.
          #
          # Moved 2026-09-06. The previous pin (nightly-2026-07-22) hit 46 days
          # and did exactly that: the 2026-09-06 nightly run failed on the
          # freshness check. The reason for the old pin is gone -- the
          # rustc_codegen_ssa ICE on tokio in nightly-2026-07-23 is six weeks
          # behind us -- so this moves forward instead of re-floating.
          # nightly-2026-09-01 is rustc 1.100.0-nightly (0dfb098f3) and builds
          # all 11 fuzz targets under ASan. When this expires, move it forward
          # again and restate the reason; do not raise MAX_PIN_AGE_DAYS.
          toolchain: nightly-2026-09-01

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/query/fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('crates/query/fuzz/Cargo.lock') }}
          restore-keys: |
            fuzz-${{ runner.os }}-

      # The corpus is gitignored, so without this cache every run restarts from
      # an empty corpus and relearns the same shallow inputs. The key carries
      # the run id so each run saves a fresh entry, and restore-keys pulls the
      # newest previous corpus for this target: the standard append-only cache
      # pattern. Caches saved on main are visible to PR runs, so nightly runs
      # (long budget) feed the corpus that PR runs start from.
      - name: Fuzz corpus cache (${{ matrix.target }})
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/query/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      # `cargo fuzz` has no --locked flag (cargo-fuzz 0.13 rejects the argument
      # outright), so the checked-in lock only means something if a separate
      # step asserts it. Without this the fuzz build regenerates the lock every
      # run: it sat four minors stale at 0.21.0 while the cache above keyed on
      # hashFiles() of it, deriving a key from a file the build ignored.
      - name: Verify the checked-in fuzz lockfile is current
        working-directory: crates/query/fuzz
        run: cargo +nightly-2026-09-01 metadata --locked --format-version 1 > /dev/null

      # `cargo fuzz` expects `<crate>/fuzz/Cargo.toml` relative to its cwd,
      # so we run from `crates/query` (the crate under test), not from
      # `crates/query/fuzz` itself.
      # The corpus dir is cargo-fuzz's default (kept explicit because a second
      # dir follows); `fuzz/seeds/<target>` holds checked-in valid inputs
      # (encoded wire frames, real WAL files) that the fuzzer mutates from.
      # Both dirs are mkdir'd so targets without checked-in seeds still run.
      - name: Run ${{ matrix.target }}
        working-directory: crates/query
        env:
          # fuzz_wal_replay builds its crashed-database template once via
          # std::mem::forget (the standard crash-simulation technique, same as
          # the durability test suite), which LeakSanitizer reports as a
          # one-time ~13KB leak at exit. Disable leak detection for that
          # target only; ASan's memory-error detection stays fully on.
          ASAN_OPTIONS: ${{ matrix.target == 'fuzz_wal_replay' && 'detect_leaks=0' || '' }}
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }}
          echo "budget: ${FUZZ_BUDGET}s (event: ${{ github.event_name }})"
          echo "restored corpus entries: $(find fuzz/corpus/${{ matrix.target }} -type f | wc -l)"
          cargo fuzz run ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} -- \
            -max_total_time="${FUZZ_BUDGET}" \
            -timeout=5 \
            -max_len=2048 \
            -print_final_stats=1

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: crates/query/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # A toolchain pin is invisible once it works: the job stays green while the
  # compiler, the sanitizer and the codegen backend it exercises stop moving.
  # This runs on the nightly cron so a pin that has outlived its reason turns
  # into a red run instead of quietly aging out.
  nightly-pin-freshness:
    name: nightly pin freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The selftest runs first, on a fixture: it proves this check still
      # refuses a stale pin, still finds all three shapes a pin takes in these
      # workflows (a `toolchain:` value, a `FUZZ_TOOLCHAIN` env value and a
      # `cargo +nightly-...` invocation) and still ignores a date that appears
      # only in a comment. Without it, a detector that quietly stopped matching
      # would report "all floating OK" forever.
      - name: Prove the freshness check can fail
        run: bash scripts/ci/check-nightly-pin.sh --selftest

      - name: Fail if a pinned nightly has gone stale
        run: bash scripts/ci/check-nightly-pin.sh
