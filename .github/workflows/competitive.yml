name: competitive
# Manual evidence collection. No ranking is released when qualification fails.
on:
  workflow_dispatch:
    inputs:
      rows:
        description: 'Rows per engine (1000..1000000)'
        default: '10000'
        required: true
permissions:
  contents: read
jobs:
  reads:
    name: relational reads (${{ matrix.cohort }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cohort: [embedded, server]
    env:
      RUSTFLAGS: '-C target-cpu=x86-64-v2'
      ROWS: ${{ inputs.rows }}
      COHORT: ${{ matrix.cohort }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Set an absolute artifact-safe work directory
        run: echo "WORK=$RUNNER_TEMP/competitive" >> "$GITHUB_ENV"
      - name: Validate collector/scorer adversarial fixtures
        run: python3 -m unittest discover -s scripts/competitive -p 'test_*.py'
      - name: Build pinned clients and libraries before measurement
        run: bash scripts/competitive/build.sh "$WORK"
      - name: Fetch pinned server images before measurement
        if: matrix.cohort == 'server'
        run: |
          python3 - <<'PY'
          import json,subprocess
          pins=json.load(open('scripts/competitive/engines.json'))['images']
          for image in pins.values():
              subprocess.run(['docker','pull',image],check=True)
          PY
      - name: Verify live server fixtures and typed result conversion
        if: matrix.cohort == 'server'
        env:
          LD_LIBRARY_PATH: ${{ env.WORK }}/lib
        run: python3 scripts/competitive/server_smoke.py --work "$WORK" --pins scripts/competitive/engines.json
      - name: Collect rotated rounds on an otherwise idle job
        env:
          LD_LIBRARY_PATH: ${{ env.WORK }}/lib
        run: |
          python3 - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          work=Path(os.environ['WORK'])
          pins=json.load(open('scripts/competitive/engines.json'))['images']
          engines='sqlite,sqlite-aa,powdb-powql,powdb-sql,duckdb' if os.environ['COHORT']=='embedded' else 'sqlite,postgres,postgres-aa,mysql,powdb-server,powdb-server-sql'
          # Pin workers and their owned server to one CPU; the controller and
          # memory sampler remain on a different physical core when available.
          cpus=sorted(os.sched_getaffinity(0))
          worker=cpus[-1]
          topology=lambda c:Path(f'/sys/devices/system/cpu/cpu{c}/topology/core_id').read_text().strip()
          controller=next((c for c in cpus if topology(c)!=topology(worker)),None)
          if controller is None:
              raise SystemExit('separate worker/controller physical cores required')
          os.sched_setaffinity(0,{controller})
          command=[sys.executable,'scripts/competitive/run.py','--worker-dir',str(work/'bin'),
            '--temp-dir',str(work/'data'),'--output',str(work/'observations.json'),
            '--rows',os.environ['ROWS'],'--rounds',str(len(engines.split(','))),
            '--engines',engines,'--cpu',str(worker),'--isolated-host',
            '--postgres-image',pins['postgres'],'--mysql-image',pins['mysql'],'--powdb-image',pins['powdb']]
          subprocess.run(command,check=True)
          PY
      - name: Validate answers and qualify scores
        if: always()
        run: |
          if test -f "$WORK/observations.json"; then
            python3 scripts/competitive/score.py "$WORK/observations.json" --output "$WORK/scorecard.json"
          fi
      - name: Retain evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: competitive-${{ matrix.cohort }}-${{ inputs.rows }}
          path: |
            ${{ env.WORK }}/*.json
            ${{ env.WORK }}/*-features.txt
            ${{ env.WORK }}/*-linked-libraries.txt
          if-no-files-found: error
