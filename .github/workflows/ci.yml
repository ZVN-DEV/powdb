name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Pull requests only. On main, back-to-back merges cancelled the earlier
  # commit's run, leaving main's history dotted with cancelled runs that are
  # indistinguishable at a glance from runs that failed, and no recorded
  # verdict for the commit that was cancelled. Harmless with `strict: true`
  # branch protection (the squash result equals the PR head tree) but it makes
  # main's CI history unreadable, which is where you look during an incident.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    name: clippy + fmt + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 25, not 15. The macOS leg took 10.0 minutes on the last release run with a
    # warm cache, which leaves five minutes of headroom for a cold one: that is
    # a flake waiting to be reported as a failure, and a timeout tells you
    # nothing about why. Raising it costs nothing when the job is healthy, and
    # a genuinely hung job still ends.
    timeout-minutes: 25
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      # The `testing` feature enables `Engine::set_force_generic_path`, which
      # runs a query twice, once through the optimized fast paths and once
      # through the generic evaluator, and asserts the two answers agree.
      # Roughly 5,900 LOC of the strongest correctness tests in the repo sit
      # behind it (access_path_equivalence, cross_type_index_parity,
      # cross_type_matrix, cross_type_arithmetic_edges,
      # proptest_frontend_equivalence, part of topn_tie_eviction) and CI never
      # enabled it, so none of them had ever run here.
      #
      # That mattered: three of the four correctness defects fixed in v0.23.0
      # were fast-path-disagrees-with-generic-path bugs, which is precisely
      # what these tests detect. The repo owned the detector and did not run it.
      - name: Run dual-path equivalence tests (`testing` feature)
        run: cargo test -p powdb-query --features testing --locked

  miri:
    name: miri (powdb-storage, ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # miri interprets rather than executes, so this job is slow by nature. Run
    # as one job it sat at 16 to 20 minutes and owned the whole CI critical path
    # while every other job finished inside 7. Sharding by MODULE only moved the
    # problem: `btree` alone ran 11.1, 13.5 and 18.1 minutes on the last three
    # main runs, against a 20 minute timeout, while the other two shards
    # finished in under two. btree is now split three ways by test-name prefix
    # as well, so no shard carries more than about a third of it.
    #
    # This is a wall-clock change only: every test still runs on every commit,
    # and `scripts/ci/miri-shards.sh` fails the job if the shards stop covering
    # the modules in scope, stop matching the names below, start overlapping,
    # or (the guard prefix sharding needs) leave any in-scope test unselected.
    # 20 minutes is now several times the expected per-shard time, so a real
    # hang still shows up as a timeout.
    timeout-minutes: 20
    strategy:
      # One slow shard failing should not hide the verdict of the others.
      fail-fast: false
      matrix:
        shard: [btree-core, btree-nonunique, btree-stats, row-page, json-types-view]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly with miri
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: miri

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: miri-${{ matrix.shard }}

      - name: Run miri on powdb-storage (shard ${{ matrix.shard }})
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # Validates the shard map (union covers the canonical filter set, and
          # the shard names here match ci.yml) before printing this shard's
          # filters, so a dropped filter fails instead of shrinking the run.
          # Assigned first on purpose: `read -a x <<< "$(cmd)"` swallows a
          # failing cmd and leaves an empty array, which is how a broken shard
          # map would turn into a job that runs nothing and exits 0.
          # The shard map's own guards run first, on fixtures: they prove the
          # coverage check still refuses an unsharded in-scope test and still
          # ignores an out-of-scope module. A detector that stopped detecting
          # would otherwise report "all tests selected" forever.
          bash scripts/ci/miri-shards.sh --selftest
          shard_filters="$(bash scripts/ci/miri-shards.sh "$SHARD")"
          read -r -a filters <<< "$shard_filters"
          if (( ${#filters[@]} == 0 )); then
            echo "::error::miri shard '$SHARD' resolved to zero filters"
            exit 1
          fi
          echo "shard $SHARD filters: ${filters[*]}"
          # Two guards, both against the SAME target selection as the run below
          # (no --lib): a guard that inspects a different set of targets than
          # the run does is not evidence about the run.
          #
          # First, prove the shard map still covers every test miri is meant to
          # interpret. Filters are test-name prefixes now, not whole modules, so
          # a newly added `btree::tests::verify_something` could match nothing
          # and never run while every shard stayed green. The unfiltered listing
          # is the only thing that can see that, and it costs one extra --list
          # against an already-built binary.
          cargo +nightly miri test -p powdb-storage -- --list > /tmp/miri-listing.txt
          bash scripts/ci/miri-shards.sh --check-listing /tmp/miri-listing.txt
          # Second, a libtest filter that matches nothing exits 0, so a renamed
          # or deleted module would silently empty this shard instead of failing
          # it (a `tx::tests` filter did exactly that: there is no tx module).
          # Require each filter to select at least one test. This runs per
          # shard, so sharding cannot dilute it. Prefix match, not "$filter::":
          # a filter is now a name prefix such as `btree::tests::stats_`.
          listing=$(cargo +nightly miri test -p powdb-storage -- --list "${filters[@]}")
          for filter in "${filters[@]}"; do
            if ! grep -q "^${filter}" <<<"$listing"; then
              echo "::error::miri filter '${filter}' matches no test in powdb-storage"
              exit 1
            fi
          done
          cargo +nightly miri test -p powdb-storage -- "${filters[@]}"

  miri-query:
    name: miri (powdb-query, compiled)
    runs-on: ubuntu-24.04
    # The compiled predicate module evaluates filters over raw row and PJ1
    # document bytes with hand-computed offsets, exactly where undefined or
    # out-of-bounds behavior would hide. Its unit tests are pure in-memory,
    # so miri can interpret them; the rest of the executor reads through
    # libc::mmap, which miri cannot. Scoped to --lib on both the list and
    # the run, so the guard inspects the same target set it runs.
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly with miri
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: miri

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: miri-query-compiled

      - name: Run miri on powdb-query (compiled predicates)
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: |
          set -euo pipefail
          filter="executor::compiled::tests"
          # A libtest filter that matches nothing exits 0, so a renamed or
          # deleted module would silently empty this job instead of failing
          # it. Require the filter to select at least one test first.
          listing=$(cargo +nightly miri test -p powdb-query --lib -- --list "$filter")
          if ! grep -q "^${filter}::" <<<"$listing"; then
            echo "::error::miri filter '${filter}' matches no test in powdb-query"
            exit 1
          fi
          cargo +nightly miri test -p powdb-query --lib -- "$filter"

  asan:
    name: AddressSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-Zsanitizer=address"
      RUSTDOCFLAGS: "-Zsanitizer=address"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: rust-src

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: asan

      - name: Run tests with AddressSanitizer
        env:
          ASAN_OPTIONS: "detect_leaks=0"
        run: cargo +nightly test --workspace --target x86_64-unknown-linux-gnu -Zbuild-std

  msrv-consistency:
    name: MSRV consistency (Cargo.toml ↔ README ↔ Dockerfile)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check MSRV is consistent everywhere
        run: |
          set -euo pipefail
          MSRV=$(grep -E '^rust-version' Cargo.toml | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+)".*/\1/')
          if [ -z "$MSRV" ]; then
            echo "::error::Could not parse rust-version from Cargo.toml"
            exit 1
          fi
          echo "Cargo.toml rust-version: $MSRV"

          if ! grep -qE "MSRV-${MSRV}-blue" README.md; then
            echo "::error::README MSRV badge does not match Cargo.toml ($MSRV). Update the [![MSRV] badge."
            exit 1
          fi
          if ! grep -qE "Rust ${MSRV}\+" README.md; then
            echo "::error::README text does not mention 'Rust ${MSRV}+'. Update README."
            exit 1
          fi

          DOCKER_RUST=$(grep -E '^FROM (--platform=\S+ )?rust:' Dockerfile | head -1 | sed -E 's/.*rust:([0-9]+\.[0-9]+).*/\1/')
          echo "Dockerfile rust: $DOCKER_RUST"
          # Dockerfile may be newer than MSRV, but never older.
          if [ "$(printf '%s\n%s\n' "$MSRV" "$DOCKER_RUST" | sort -V | head -1)" != "$MSRV" ]; then
            echo "::error::Dockerfile rust version ($DOCKER_RUST) is older than MSRV ($MSRV)."
            exit 1
          fi
          echo "MSRV consistency OK."

  msrv-build:
    name: MSRV build + test (cargo +<msrv>)
    runs-on: ubuntu-24.04
    # 30, not 20: this job now compiles and runs the storage and query test
    # suites on the MSRV toolchain, not just `cargo check`.
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          MSRV=$(grep -E '^rust-version' Cargo.toml | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+(\.[0-9]+)?)".*/\1/')
          if [ -z "$MSRV" ]; then
            echo "::error::Could not parse rust-version from Cargo.toml"
            exit 1
          fi
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"
          echo "MSRV is $MSRV"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv-build-${{ steps.msrv.outputs.version }}

      # `--locked` so a newer-than-MSRV language feature (or a Cargo.lock that
      # only resolves on newer Rust) can't slip past the doc-only consistency
      # check above. This compiles the whole workspace on the real MSRV
      # toolchain.
      - name: cargo +MSRV check --workspace --locked
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --locked

      # `check` proves the workspace COMPILES on the MSRV toolchain and nothing
      # more. The stated support claim is that PowDB works on this Rust
      # version, and behaviour differences between compilers land in generated
      # code, not in type checking: the engine here does its own byte-level
      # layout, alignment and offset arithmetic, which is exactly the class of
      # thing a codegen or std change moves. Running the two engine crates'
      # suites turns "it builds" into "it works". Only storage and query: they
      # hold every hand-rolled format and every executor fast path, and adding
      # the server and CLI suites would double this job for network and
      # process plumbing that stable already covers.
      - name: cargo +MSRV test -p powdb-storage -p powdb-query --locked
        run: cargo +${{ steps.msrv.outputs.version }} test -p powdb-storage -p powdb-query --locked

  examples-smoke:
    name: examples smoke (terraform validate + compose config + dev.sh + runnable examples)
    runs-on: ubuntu-24.04
    # 20, not 15: the edge-snapshot-serving example added below links the
    # powdb-server release binary on top of the powdb-cli one nested-results
    # already builds, and the release profile is lto=true / codegen-units=1.
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: examples-smoke

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.5"
          terraform_wrapper: false

      - name: terraform validate (examples/deploy/aws-ecs)
        working-directory: examples/deploy/aws-ecs
        run: |
          terraform init -backend=false
          terraform validate

      - name: docker compose config (examples/deploy/cloudflare-tunnel)
        working-directory: examples/deploy/cloudflare-tunnel
        env:
          POWDB_PASSWORD: ci-smoke-not-a-real-secret
        run: docker compose -f docker-compose.yml config -q

      - name: dev.sh up/down cycle
        run: |
          bash scripts/dev.sh up
          sleep 1
          bash scripts/dev.sh down

      - name: nested-results example (build + run, PASS/FAIL gated)
        run: bash examples/nested-results/run.sh

      # The more failure-prone of the two runnable examples, and until now the
      # only one nothing gated: it drives backup, restore, two read-only server
      # processes, an incremental backup, and an atomic serve-directory swap.
      # It reuses the release binaries the step above already built, and exits
      # nonzero if any of its 14 checks fail.
      - name: edge-snapshot-serving example (backup/restore/swap cycle, PASS/FAIL gated)
        run: bash examples/edge-snapshot-serving/run.sh

  version-consistency:
    name: version consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prove the series parser can refuse a malformed version
        run: bash scripts/check-version-consistency.sh --selftest
      - name: Check release/version metadata
        run: bash scripts/check-version-consistency.sh

      # Added as steps here rather than as a new job so `ci-success.needs` and
      # CONTRIBUTING.md's job list stay in step; this job is the natural home
      # for "the repo's hand-maintained lists still describe the repo".
      - name: Prove the dependabot coverage check can fail
        run: bash scripts/ci/check-dependabot-coverage.sh --selftest
      - name: Every dependency manifest is watched by dependabot
        run: bash scripts/ci/check-dependabot-coverage.sh

  ts-client:
    name: TypeScript client (build + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ts-client

      - name: Configure pnpm store
        working-directory: clients/ts
        run: npm exec --yes --package=pnpm@10.29.3 -- pnpm config set store-dir .pnpm-store

      - name: pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: clients/ts/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('clients/ts/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install TypeScript dependencies
        working-directory: clients/ts
        run: npm exec --yes --package=pnpm@10.29.3 -- pnpm install --frozen-lockfile

      - name: Build TypeScript package
        working-directory: clients/ts
        run: npm exec --yes --package=pnpm@10.29.3 -- pnpm build

      - name: Run pure TypeScript tests
        working-directory: clients/ts
        run: |
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:escape
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:protocol
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:typed
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:errors
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:script

      - name: Build release powdb-server for server-backed TypeScript tests
        run: cargo build --release -p powdb-server --locked

      - name: Run server-backed TypeScript tests
        working-directory: clients/ts
        run: |
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:auth
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:pool
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:sync-live
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:eager
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:exec-script

  node-addon:
    name: Node embedded addon (build + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: node-addon
          workspaces: bindings/node

      - name: rustfmt
        working-directory: bindings/node
        run: cargo fmt --check

      - name: clippy
        working-directory: bindings/node
        run: cargo clippy --release --locked -- -D warnings

      - name: Install addon dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Build addon (napi)
        working-directory: bindings/node
        run: npm run build

      - name: Test addon
        working-directory: bindings/node
        run: npm test

  embedded-sync-js:
    name: Embedded sync JS package (build + native/e2e tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: embedded-sync-js
          workspaces: |
            .
            bindings/node

      - name: Build release CLI and server
        run: cargo build --release -p powdb-cli -p powdb-server --locked

      - name: Install addon dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Build embedded addon
        working-directory: bindings/node
        run: npm run build

      - name: Configure pnpm store
        working-directory: clients/sync
        run: npm exec --yes --package=pnpm@10.29.3 -- pnpm config set store-dir .pnpm-store

      - name: pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: clients/sync/.pnpm-store
          key: pnpm-sync-${{ runner.os }}-${{ hashFiles('clients/sync/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-sync-${{ runner.os }}-

      - name: Install sync package dependencies
        working-directory: clients/sync
        run: npm exec --yes --package=pnpm@10.29.3 -- pnpm install --frozen-lockfile

      - name: Build sync package
        working-directory: clients/sync
        run: npm exec --yes --package=pnpm@10.29.3 -- pnpm run build

      # The three published READMEs are API documentation that nothing compiled
      # until now, so their samples rotted: `queryTyped<User>` with an
      # `interface` never type-checked, the addon sample read `.rows` off an
      # un-narrowed union, and the sync adapter example could not be assigned
      # to the addon's own parameter type. This is the only job that both
      # builds the addon (the checker needs its generated index.d.ts) and has a
      # TypeScript toolchain, so the check lives here.
      - name: Type-check the README samples of all three JS packages
        working-directory: clients/sync
        run: npm exec --yes --package=pnpm@10.29.3 -- pnpm run test:readme

      - name: Run sync package tests
        working-directory: clients/sync
        env:
          POWDB_SYNC_NATIVE_EMBEDDED_ENTRY: ${{ github.workspace }}/bindings/node/index.js
          POWDB_CLI_BIN: ${{ github.workspace }}/target/release/powdb-cli
          POWDB_SERVER_BIN: ${{ github.workspace }}/target/release/powdb-server
        run: |
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test
          npm exec --yes --package=pnpm@10.29.3 -- pnpm run test:native
          npm exec --yes --package=pnpm@10.29.3 -- pnpm run test:e2e

  # Format compatibility against the binaries users actually installed, in both
  # directions. Every other compatibility test in this repo asserts against
  # bytes this repo wrote itself (catalog_v7_migration.rs builds its "v6"
  # fixture with today's writer), so a wrong encoder would produce a wrong
  # fixture and a green test. This job removes the shared author.
  cross-version-compat:
    name: cross-version compat (real released binaries, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Both published platforms, because the thing under test is an on-disk
    # format read by binaries users installed, and every release ships
    # linux-x86_64 AND macos-aarch64 assets. Running only the Linux half tested
    # one endianness, one page size and one filesystem, and left the platform
    # most contributors develop on unverified against real released binaries.
    # `scripts/ci/cross-version-compat.sh` already resolves the right asset
    # suffix from `uname` and refuses a platform with no released asset.
    strategy:
      # A format problem on one platform must not hide the other's verdict.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    # 40, not 25: the macOS leg builds the HEAD powdb-cli on a slower runner.
    timeout-minutes: 40
    # `gh release list` derives the tested version list. Read-only, and the
    # script falls back to a validated pinned list if the call fails.
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cross-version-compat-${{ matrix.os }}

      # The tested version list is derived from the live release list, so the
      # cache key has to come from the same call rather than a hand-copied
      # literal. The literal was the bug: it named v0.19.1 through v0.21.0 long
      # after v0.24.0 shipped. Resolving once and exporting the result also
      # guarantees the run below tests exactly the versions the key was built
      # from, instead of re-resolving and possibly disagreeing with its cache.
      - name: Resolve compat version list
        id: compat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plan="$(bash scripts/ci/cross-version-compat.sh --print-plan)"
          echo "$plan"
          versions="$(sed -n 's/^versions=//p' <<<"$plan")"
          floor="$(sed -n 's/^floor=//p' <<<"$plan")"
          if [ -z "$versions" ] || [ -z "$floor" ]; then
            echo "::error::could not resolve the cross-version compat plan"
            exit 1
          fi
          {
            echo "POWDB_COMPAT_VERSIONS=$versions"
            echo "POWDB_COMPAT_FLOOR=$floor"
          } >> "$GITHUB_ENV"
          echo "cache-key=$(echo "$versions $floor" | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      # Released binaries are immutable per tag, so the cache key is the
      # resolved version list itself.
      - name: Released binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/compat-bins
          # runner.os is already in the key, so the two legs cache the two
          # different sets of released assets separately.
          key: compat-bins-${{ runner.os }}-${{ steps.compat.outputs.cache-key }}

      - name: Build HEAD powdb-cli
        run: cargo build --release -p powdb-cli --locked

      - name: Cross-version compatibility (forward + downgrade)
        run: bash scripts/ci/cross-version-compat.sh

  # Deterministic replay of the checked-in fuzz corpus. `fuzz.yml` runs a
  # time-budgeted campaign, which explores and therefore cannot be a required
  # check; this replays a fixed input set exactly once each, so its verdict is
  # a function of the commit. It also refuses to "pass" a target whose seed
  # directory is empty.
  fuzz-corpus-replay:
    name: fuzz corpus replay (deterministic)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          # Same pin as fuzz.yml, and it must stay the same: this job replays
          # the corpus that fuzz.yml produced, so a different compiler here
          # would replay those inputs against different code.
          # `nightly-pin-freshness` in fuzz.yml fails once the pin goes stale,
          # so it cannot rot silently. Moved 2026-09-06 with fuzz.yml; the
          # reason for the old nightly-2026-07-22 pin (a tokio ICE in
          # nightly-2026-07-23) no longer applies.
          toolchain: nightly-2026-09-01

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            crates/query/fuzz/target
          key: fuzz-replay-${{ runner.os }}-${{ hashFiles('crates/query/fuzz/Cargo.lock') }}
          restore-keys: |
            fuzz-replay-${{ runner.os }}-

      # The cache above restores ~/.cargo/bin but not cargo's install-tracking
      # metadata (~/.cargo/.crates.toml), so an unconditional install sees an
      # untracked binary and hard-fails with "already exists in destination".
      # Version-pinned, like every other tool this pipeline installs: this
      # binary decides what "replaying the corpus" means, and a floating build
      # tool makes the replay's verdict a function of the day rather than of
      # the commit, which is the one property this job exists to have.
      - name: Install cargo-fuzz (pinned)
        env:
          CARGO_FUZZ_VERSION: 0.13.2
        run: command -v cargo-fuzz >/dev/null 2>&1 || cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked

      - name: Replay the checked-in corpus
        env:
          FUZZ_TOOLCHAIN: nightly-2026-09-01
        run: bash scripts/ci/fuzz-corpus-replay.sh

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-replay-crashes
          path: crates/query/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # Run the corruption and wire-corpus suites against the SHIPPED panic
  # configuration. `panic = "abort"` is on [profile.release] only, so every
  # "the server did not abort" assertion elsewhere in the suite actually
  # observed an unwinding test-profile binary.
  release-profile-suites:
    name: release-profile suites (panic=abort, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Both platforms. What this job observes is a PROCESS dying from an abort,
    # and how a process dies is the most operating-system-specific behaviour in
    # the suite: signal delivery, zombie reaping and the abort handler itself
    # all differ. The script was already written to run on macOS (its TCP
    # helpers go through python3 precisely so a developer laptop can execute
    # it), and it was still only ever run on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    # 60, not 40: this compiles the release profile (lto, one codegen unit) for
    # three crates' test targets, and the macOS runner is slower.
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-profile-suites-${{ matrix.os }}

      - name: Corruption + wire-corpus suites, release profile
        run: bash scripts/ci/release-profile-suites.sh

  # The bench comparator is the only thing standing between a perf regression
  # and a green release, and nothing checks the comparator. This drives it over
  # synthetic fixtures and asserts each failing verdict is reachable. Fast (no
  # benchmarking), unlike bench.yml itself.
  bench-gate-selftest:
    name: bench gate self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: bench-gate-selftest

      - name: Prove every comparator verdict is reachable
        run: bash scripts/ci/bench-gate-selftest.sh

  # A job that is not in ci-success's `needs:` blocks nothing. The comment on
  # that job asks contributors to keep the list current; this makes forgetting
  # it a build failure instead of a silently unguarded job. Pure text parsing,
  # no cargo, so it costs seconds.
  ci-needs-completeness:
    name: ci-success needs completeness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The selftest first, on fixture workflows: a clean pair passes and
      # thirteen mutations each fail, so a parser that has stopped seeing jobs
      # is caught here rather than by nobody.
      - name: Prove the needs checker can fail
        run: bash scripts/ci/check-ci-success-needs.sh --selftest

      - name: Every ci.yml job must be required by ci-success
        run: bash scripts/ci/check-ci-success-needs.sh

  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The gitleaks GitHub Action wrapper requires a paid license for
      # organization repos (ZVN-DEV is an org) and hard-fails without a
      # GITLEAKS_LICENSE secret before scanning anything. The gitleaks CLI
      # itself is MIT-licensed and free, so we pin and run the binary directly
      # — same `gitleaks detect` invocation as scripts/quality.sh, at $0.
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, taken from the release
      # asset on 2026-09-06. Every `uses:` in this repo is pinned to a 40-hex
      # SHA; a tarball fetched over curl and then run against the full git
      # history deserves the same treatment, and a GitHub version tag can be
      # moved. Recompute when GITLEAKS_VERSION changes:
      #   curl -sSfL <url> | sha256sum
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (git repo, low-noise config)
        run: gitleaks detect --redact --config .gitleaks.toml --source .

  audit:
    name: cargo audit (advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      # Pin the gate's own binary. Bump deliberately, the way every other tool
      # version in this pipeline is bumped.
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The ignore list used to carry four IDs. Three of them
      # (RUSTSEC-2026-0179 / -0180 postgres-protocol, RUSTSEC-2026-0178
      # tokio-postgres) were resolved by the dependency refresh in #211 and are
      # removed: verified dead against the current Cargo.lock, and cargo-deny
      # was already reporting all of them as `advisory-not-detected`.
      #
      # RUSTSEC-2026-0235 (rkyv 0.7 out-of-bounds read) stays, because it is
      # NOT dead. Its whole path is rkyv -> rust_decimal -> mysql_common ->
      # mysql -> powdb-compare, which is `publish = false` and pulls `mysql`
      # only through a non-default optional feature. No shipping crate reaches
      # it. cargo-deny resolves the feature graph and so never sees it, but
      # cargo-audit scans Cargo.lock and classifies it as a vulnerability
      # (hard-fail), so dropping it here would redden this job. Keep in sync
      # with `.cargo/audit.toml`, which the local `cargo audit` reads and which
      # documents the bar for adding anything back.
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # rustsec/audit-check compiled cargo-audit from source on every run: 304
      # `Compiling` lines and 3.1 minutes, for a gate binary whose version
      # floated with whatever crates.io served that morning. A pinned install
      # plus a cache keyed on that pin makes the tool reproducible and, after
      # the first run, nearly free.
      #
      # Same verdict as before, from one list instead of two. The action did
      # not read `.cargo/audit.toml`; it took the same advisory ID through its
      # `ignore:` input, so the suppression lived in two places that had to be
      # kept in sync by hand, and the file says so. A plain `cargo audit` in
      # the checkout reads `.cargo/audit.toml`, which is where the reasoning
      # already is, so the duplicate goes away.
      # `checks: write` goes with the action; without it there is nothing to
      # annotate, and the advisory text is in the job log either way.
      - name: cargo-audit cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}

      # `command -v` guard: the cache restores the binary but cargo's
      # install-tracking metadata may not line up, and an unconditional install
      # then hard-fails with "already exists in destination". Same guard the
      # fuzz-corpus-replay job carries for cargo-fuzz.
      - name: Install cargo-audit (pinned)
        run: command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

      - name: Run cargo audit
        run: cargo audit

  # Governance gate: this is a public repo. Fail the build if internal-only
  # planning/agent artifacts get re-tracked, or if any public doc/source names
  # an internal product codename. Pure git + grep, no cargo build, so it is fast.
  internal-content-guard:
    name: internal-content-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout (full history for git grep / ls-files)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The selftest first, on throwaway git fixtures. It proves both halves
      # can fail, including the case that made this a script: a denylist regex
      # git cannot compile used to leave `names` empty and print "denylist
      # checked", so the guard stopped inspecting anything while the log said
      # it had run. `git ls-files` outside a repository printed "paths clean"
      # the same way.
      - name: Prove the internal-content guard can fail
        run: bash scripts/ci/internal-content-guard.sh --selftest

      # The regex comes from `secrets`, and secrets are not available to a
      # `pull_request` run from a fork. The denylist half then does not run,
      # and it used to print "clean" anyway, so the log said the guard had
      # passed when only the path check had. The script says which halves ran,
      # every time: the regex check still gets its verdict on the post-merge
      # push run, and a reader of a fork PR can see that it is pending.
      - name: Fail on tracked internal-only content
        env:
          PUBLICATION_DENYLIST_REGEX: ${{ secrets.PUBLICATION_DENYLIST_REGEX }}
        run: bash scripts/ci/internal-content-guard.sh

  # Supply-chain policy gate: license allowlist, duplicate-version warnings,
  # and crates.io-only sources, driven by deny.toml at the repo root.
  # Advisories are deliberately NOT checked here: the `audit` job (rustsec
  # audit-check) already gates them, so cargo-deny only covers what audit
  # doesn't.
  deny:
    name: cargo deny (licenses, bans, sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources

  # Single aggregator gate. Make THIS the only required status check on `main`
  # (Settings → Branches → branch protection → require "ci-success"). It depends
  # on every other CI job and fails if any of them did not succeed, so the full
  # matrix — asan, miri, MSRV, ts-client, secret-scan, audit, examples-smoke —
  # actually blocks merges instead of running green-or-red beside an unguarded
  # required set. Add new jobs to the `needs` list below when you add them.
  testing-feature-guard:
    name: testing-feature guard (no test instrumentation in shipped builds)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: testing-feature-guard

      # The selftest proves the detector can fire (on the dev-unified tree,
      # where `testing` is legitimately on) before the real check certifies
      # the shipped artifacts clean — a detector that cannot fire is not a
      # gate.
      - name: Prove the detector can fire
        run: bash scripts/ci/testing-feature-guard.sh --selftest

      - name: Check every shipped artifact
        run: bash scripts/ci/testing-feature-guard.sh

  missing-docs-ratchet:
    name: missing_docs ratchet (public API docs only tighten)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: missing-docs-ratchet

      # Proves the counter can see undocumented items before the baseline
      # comparison certifies anything — a blind counter would report zero
      # everywhere and look like success.
      - name: Prove the counter can see gaps
        run: bash scripts/ci/missing-docs-ratchet.sh --selftest

      - name: Every crate matches its documented-gap baseline
        run: bash scripts/ci/missing-docs-ratchet.sh

  # The public rustdoc must build warning-free. Six intra-doc links pointed at
  # private or nonexistent items for releases without anyone noticing, because
  # nothing built the docs with warnings denied: docs.rs renders the broken
  # link as plain text and moves on. Default features only. Never
  # `--all-features` here: that would enable `powdb-query/testing`, which the
  # testing-feature-guard job exists to keep out of shipped builds.
  rustdoc:
    name: rustdoc (public docs build warning-free)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rustdoc

      - name: cargo doc --workspace --no-deps (warnings denied)
        run: cargo doc --workspace --no-deps --locked

  ci-success:
    name: ci-success
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs:
      - lint-test
      - miri
      - miri-query
      - asan
      - msrv-consistency
      - msrv-build
      - examples-smoke
      - version-consistency
      - ts-client
      - node-addon
      - embedded-sync-js
      - cross-version-compat
      - fuzz-corpus-replay
      - release-profile-suites
      - bench-gate-selftest
      - ci-needs-completeness
      - secret-scan
      - audit
      - deny
      - internal-content-guard
      - testing-feature-guard
      - missing-docs-ratchet
      - rustdoc
    steps:
      # ci-success checks the repo out and runs the completeness check ITSELF,
      # which reads as belt-and-braces next to the ci-needs-completeness job
      # and is not. The old verdict was `for result in $RESULTS`, with
      # `RESULTS: ${{ join(needs.*.result, ' ') }}`. Delete the needs: list and
      # that expands to the empty string, the loop iterates zero times, and it
      # prints "All required CI jobs succeeded." ci-success is the ONE required
      # status check on main, so that turns the merge button green with nothing
      # behind it. ci-needs-completeness would have gone red, but it blocks
      # nothing except through ci-success, i.e. through the list that was just
      # deleted: the guard was circular.
      #
      # Running the check here breaks the circle, because it reads ci.yml on
      # disk rather than the needs: list. --results then compares the length of
      # the results vector against the job count parsed out of the file, so an
      # emptied needs: list fails from inside the required check.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: bash scripts/ci/check-ci-success-needs.sh --results "$RESULTS"
