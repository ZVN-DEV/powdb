name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: clippy + fmt + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      # x86-64-v2 is only valid on Linux x86_64 runners; ARM Macs need the
      # default target-cpu. The conditional step below sets RUSTFLAGS for
      # ubuntu only.

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set RUSTFLAGS (Linux)
        if: runner.os == 'Linux'
        run: echo "RUSTFLAGS=-C target-cpu=x86-64-v2" >> "$GITHUB_ENV"

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ci-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Run doc tests
        run: cargo test --workspace --doc

  miri:
    name: miri (powdb-storage)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      # miri cannot interpret libc::mmap, so we skip modules that touch the
      # mmap-based heap (heap, catalog, buffer, disk, wal, and integration
      # tests). The remaining modules (btree, page, row, types, tx, view)
      # still give strong UB coverage of the core data-structures.
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust nightly with miri
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: miri

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: miri-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            miri-${{ runner.os }}-

      - name: Run miri on powdb-storage (non-mmap modules)
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: |
          cargo +nightly miri test -p powdb-storage -- \
            btree::tests page::tests row::tests types::tests tx::tests view::tests

  asan:
    name: AddressSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-Zsanitizer=address"
      RUSTDOCFLAGS: "-Zsanitizer=address"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: rust-src

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: asan-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            asan-${{ runner.os }}-

      - name: Run tests with AddressSanitizer
        env:
          ASAN_OPTIONS: "detect_leaks=0"
        run: cargo +nightly test --workspace --target x86_64-unknown-linux-gnu -Zbuild-std

  msrv-consistency:
    name: MSRV consistency (Cargo.toml ↔ README ↔ Dockerfile)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check MSRV is consistent everywhere
        run: |
          set -euo pipefail
          MSRV=$(grep -E '^rust-version' Cargo.toml | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+)".*/\1/')
          if [ -z "$MSRV" ]; then
            echo "::error::Could not parse rust-version from Cargo.toml"
            exit 1
          fi
          echo "Cargo.toml rust-version: $MSRV"

          if ! grep -qE "MSRV-${MSRV}-blue" README.md; then
            echo "::error::README MSRV badge does not match Cargo.toml ($MSRV). Update the [![MSRV] badge."
            exit 1
          fi
          if ! grep -qE "Rust ${MSRV}\+" README.md; then
            echo "::error::README text does not mention 'Rust ${MSRV}+'. Update README."
            exit 1
          fi

          DOCKER_RUST=$(grep -E '^FROM (--platform=\S+ )?rust:' Dockerfile | head -1 | sed -E 's/.*rust:([0-9]+\.[0-9]+).*/\1/')
          echo "Dockerfile rust: $DOCKER_RUST"
          # Dockerfile may be newer than MSRV, but never older.
          if [ "$(printf '%s\n%s\n' "$MSRV" "$DOCKER_RUST" | sort -V | head -1)" != "$MSRV" ]; then
            echo "::error::Dockerfile rust version ($DOCKER_RUST) is older than MSRV ($MSRV)."
            exit 1
          fi
          echo "MSRV consistency OK."

  msrv-build:
    name: MSRV build (cargo +<msrv> check --workspace --locked)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          MSRV=$(grep -E '^rust-version' Cargo.toml | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+(\.[0-9]+)?)".*/\1/')
          if [ -z "$MSRV" ]; then
            echo "::error::Could not parse rust-version from Cargo.toml"
            exit 1
          fi
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"
          echo "MSRV is $MSRV"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-build-${{ runner.os }}-${{ steps.msrv.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            msrv-build-${{ runner.os }}-${{ steps.msrv.outputs.version }}-

      # `--locked` so a newer-than-MSRV language feature (or a Cargo.lock that
      # only resolves on newer Rust) can't slip past the doc-only consistency
      # check above. This compiles the whole workspace on the real MSRV
      # toolchain.
      - name: cargo +MSRV check --workspace --locked
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --locked

  examples-smoke:
    name: examples smoke (terraform validate + compose config + dev.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      # dev.sh builds powdb-server, which picks up target-cpu=native from
      # .cargo/config.toml and SIGILLs on the heterogeneous shared runner.
      # Override with a portable baseline, same as the other build jobs.
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: examples-smoke-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            examples-smoke-${{ runner.os }}-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.5"
          terraform_wrapper: false

      - name: terraform validate (examples/deploy/aws-ecs)
        working-directory: examples/deploy/aws-ecs
        run: |
          terraform init -backend=false
          terraform validate

      - name: docker compose config (examples/deploy/cloudflare-tunnel)
        working-directory: examples/deploy/cloudflare-tunnel
        env:
          POWDB_PASSWORD: ci-smoke-not-a-real-secret
        run: docker compose -f docker-compose.yml config -q

      - name: dev.sh up/down cycle
        run: |
          bash scripts/dev.sh up
          sleep 1
          bash scripts/dev.sh down

  version-consistency:
    name: version consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check release/version metadata
        run: bash scripts/check-version-consistency.sh

  ts-client:
    name: TypeScript client (build + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ts-client-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ts-client-${{ runner.os }}-

      - name: Configure pnpm store
        working-directory: clients/ts
        run: npm exec --yes --package=pnpm@10.29.3 -- pnpm config set store-dir .pnpm-store

      - name: pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: clients/ts/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('clients/ts/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install TypeScript dependencies
        working-directory: clients/ts
        run: npm exec --yes --package=pnpm@10.29.3 -- pnpm install --frozen-lockfile

      - name: Build TypeScript package
        working-directory: clients/ts
        run: npm exec --yes --package=pnpm@10.29.3 -- pnpm build

      - name: Run pure TypeScript tests
        working-directory: clients/ts
        run: |
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:escape
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:protocol
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:typed
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:errors
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:script

      - name: Build release powdb-server for server-backed TypeScript tests
        run: cargo build --release -p powdb-server

      - name: Run server-backed TypeScript tests
        working-directory: clients/ts
        run: |
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:auth
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:pool
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:sync-live
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:eager
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test:exec-script

  node-addon:
    name: Node embedded addon (build + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      # Portable target so the napi cdylib doesn't SIGILL on shared runners
      # (mirrors the other Rust jobs).
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bindings/node/target
          key: node-addon-${{ runner.os }}-${{ hashFiles('bindings/node/Cargo.lock') }}
          restore-keys: |
            node-addon-${{ runner.os }}-

      - name: rustfmt
        working-directory: bindings/node
        run: cargo fmt --check

      - name: clippy
        working-directory: bindings/node
        run: cargo clippy --release -- -D warnings

      - name: Install addon dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Build addon (napi)
        working-directory: bindings/node
        run: npm run build

      - name: Test addon
        working-directory: bindings/node
        run: npm test

  embedded-sync-js:
    name: Embedded sync JS package (build + native/e2e tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            bindings/node/target
          key: embedded-sync-js-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'bindings/node/Cargo.lock') }}
          restore-keys: |
            embedded-sync-js-${{ runner.os }}-

      - name: Build release CLI and server
        run: cargo build --release -p powdb-cli -p powdb-server

      - name: Install addon dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Build embedded addon
        working-directory: bindings/node
        run: npm run build

      - name: Configure pnpm store
        working-directory: clients/sync
        run: npm exec --yes --package=pnpm@10.29.3 -- pnpm config set store-dir .pnpm-store

      - name: pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: clients/sync/.pnpm-store
          key: pnpm-sync-${{ runner.os }}-${{ hashFiles('clients/sync/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-sync-${{ runner.os }}-

      - name: Install sync package dependencies
        working-directory: clients/sync
        run: npm exec --yes --package=pnpm@10.29.3 -- pnpm install --frozen-lockfile

      - name: Build sync package
        working-directory: clients/sync
        run: npm exec --yes --package=pnpm@10.29.3 -- pnpm run build

      - name: Run sync package tests
        working-directory: clients/sync
        env:
          POWDB_SYNC_NATIVE_EMBEDDED_ENTRY: ${{ github.workspace }}/bindings/node/index.js
          POWDB_CLI_BIN: ${{ github.workspace }}/target/release/powdb-cli
          POWDB_SERVER_BIN: ${{ github.workspace }}/target/release/powdb-server
        run: |
          npm exec --yes --package=pnpm@10.29.3 -- pnpm test
          npm exec --yes --package=pnpm@10.29.3 -- pnpm run test:native
          npm exec --yes --package=pnpm@10.29.3 -- pnpm run test:e2e

  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The gitleaks GitHub Action wrapper requires a paid license for
      # organization repos (ZVN-DEV is an org) and hard-fails without a
      # GITLEAKS_LICENSE secret before scanning anything. The gitleaks CLI
      # itself is MIT-licensed and free, so we pin and run the binary directly
      # — same `gitleaks detect` invocation as scripts/quality.sh, at $0.
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (git repo, low-noise config)
        run: gitleaks detect --redact --config .gitleaks.toml --source .

  audit:
    name: cargo audit (advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Ignore advisories whose ENTIRE dependency path is confined to
          # crates/compare (powdb-compare), which is `publish = false` — a
          # benchmark-only crate that pulls `postgres`/`mysql` to compare PowDB
          # against other engines. No shipping crate (storage/query/server/cli/
          # auth/backup) is affected. Keep this list in sync with
          # `.cargo/audit.toml` (which the local `cargo audit` reads).
          #   RUSTSEC-2026-0179  postgres-protocol SCRAM DoS  (→ powdb-compare)
          #   RUSTSEC-2026-0180  postgres-protocol hstore DoS (→ powdb-compare)
          #   RUSTSEC-2026-0178  tokio-postgres DataRow DoS   (→ powdb-compare)
          ignore: RUSTSEC-2026-0179,RUSTSEC-2026-0180,RUSTSEC-2026-0178

  # Governance gate: this is a public repo. Fail the build if internal-only
  # planning/agent artifacts get re-tracked, or if any public doc/source names
  # an internal product codename. Pure git + grep, no cargo build, so it is fast.
  internal-content-guard:
    name: internal-content-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout (full history for git grep / ls-files)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Fail on tracked internal-only content
        env:
          PUBLICATION_DENYLIST_REGEX: ${{ secrets.PUBLICATION_DENYLIST_REGEX }}
        run: |
          set -uo pipefail
          fail=0

          # (1) No tracked file may live under an internal-only path.
          paths="$(git ls-files | grep -E '^(docs/strategy/|docs/superpowers/|docs/audits/|docs/gtm-strategy\.md|\.omx/)' || true)"
          if [ -n "$paths" ]; then
            echo "::error::Internal-only paths are tracked in this public repo (see .gitignore):"
            echo "$paths"
            fail=1
          fi

          # (2) Optionally apply the private publication denylist without
          # storing sensitive names in this public workflow.
          if [ -n "${PUBLICATION_DENYLIST_REGEX:-}" ]; then
            names="$(git grep -niP "$PUBLICATION_DENYLIST_REGEX" -- '*.md' '*.rs' '*.toml' '*.yml' '*.yaml' || true)"
            if [ -n "$names" ]; then
              echo "::error::Private name found in a public file. Use neutral wording:"
              echo "$names"
              fail=1
            fi
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "internal-content-guard: clean."

  # Single aggregator gate. Make THIS the only required status check on `main`
  # (Settings → Branches → branch protection → require "ci-success"). It depends
  # on every other CI job and fails if any of them did not succeed, so the full
  # matrix — asan, miri, MSRV, ts-client, secret-scan, audit, examples-smoke —
  # actually blocks merges instead of running green-or-red beside an unguarded
  # required set. Add new jobs to the `needs` list below when you add them.
  ci-success:
    name: ci-success
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs:
      - lint-test
      - miri
      - asan
      - msrv-consistency
      - msrv-build
      - examples-smoke
      - version-consistency
      - ts-client
      - node-addon
      - embedded-sync-js
      - secret-scan
      - audit
      - internal-content-guard
    steps:
      - name: Verify every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job did not succeed (results: $RESULTS)"
              exit 1
            fi
          done
          echo "All required CI jobs succeeded."
