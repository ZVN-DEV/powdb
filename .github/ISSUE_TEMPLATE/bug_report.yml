name: Bug report
description: Something in PowDB is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The more reproducible the
        report, the faster we can fix it. If you suspect a security issue,
        please email kirby@zvndev.com instead — see [SECURITY.md](../../SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected to happen instead.
      placeholder: When I ran `User filter .age > 25`, the executor returned 0 rows even though `count(User)` is 100.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: PowQL statements, CLI commands, or a short Rust snippet that reproduces the issue.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PowDB version
      description: Output of `powdb-cli --version` (or crate version).
      placeholder: powdb-cli 0.4.4
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - powdb-cli (REPL)
        - powdb-server (TCP)
        - powdb-query (library)
        - powdb-storage (library)
        - "@zvndev/powdb-client (TypeScript)"
        - Other / not sure
    validations:
      required: true

  - type: input
    id: rust
    attributes:
      label: Rust toolchain (if applicable)
      description: Output of `rustc --version`.
      placeholder: rustc 1.93.0 (stable)

  - type: input
    id: os
    attributes:
      label: OS / arch
      placeholder: macOS 14.5 (aarch64) / Ubuntu 24.04 (x86_64) / etc.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / backtrace
      description: Anything from `RUST_LOG=debug` or a panic backtrace, if relevant.
      render: shell
