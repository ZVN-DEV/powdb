name: Feature request
description: Suggest a new capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement. Please check the
        existing [issues](https://github.com/zvndev/powdb/issues) and
        [PowQL reference](https://github.com/zvndev/powdb/blob/main/docs/POWQL.md)
        first to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that PowDB doesn't currently support?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        How would you like this to look in PowQL or the CLI / TS client? Concrete
        syntax sketches are extremely helpful.
      render: text
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about or worked around.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - PowQL syntax
        - Query planner / executor
        - Storage engine
        - Wire protocol / server
        - CLI / REPL
        - TypeScript client
        - Tooling / docs
    validations:
      required: true
