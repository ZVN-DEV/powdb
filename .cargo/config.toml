# Checked-in cargo config deliberately sets NO rustflags: default builds are
# portable everywhere (laptops, CI shared runners, Docker).
#
# Host-CPU-specific instructions (NEON on M1, AVX on x86) can speed up
# crc32fast (used by the WAL), which otherwise falls back to scalar code.
# If you want that locally, opt in per shell instead of editing this file:
#
#   export CARGO_BUILD_RUSTFLAGS="-C target-cpu=native"
#
# or put the old [build] rustflags block in an UNTRACKED config that outranks
# this one, e.g. ~/.cargo/config.toml. Never commit target-cpu=native: it
# produced binaries that SIGILL on CI's heterogeneous shared-runner fleet and
# forced every workflow to override RUSTFLAGS.
