# cargo-audit configuration.
#
# `cargo audit` reads this file from `.cargo/audit.toml` (relative to the repo
# root), and since 2026-09-06 the CI `audit` job runs a pinned `cargo audit` in
# the checkout, so CI and a local run read THIS file and nothing else. It used
# to use the `rustsec/audit-check` action, which does not read this file and
# took the same advisory IDs through its `ignore:` input, so the suppression
# list lived in two places that had to be kept in sync by hand. There is now
# one list, and it is this one.
#
# Policy: never suppress a vulnerability reachable from published crates.
# Optional tooling exceptions require a documented dependency path and must be
# removed when the affected dependency disappears. The mysql 28.0.4 migration
# removes rkyv 0.7, so RUSTSEC-2026-0235 no longer needs an exception.
[advisories]
ignore = []
